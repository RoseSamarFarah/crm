<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My CRM</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px;}
input,select,textarea,button{font-family:inherit;font-size:13px;}
input,select,textarea{background:#f3f3f0;border:0.5px solid #ddd;border-radius:8px;padding:8px 12px;color:#1a1a1a;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#7F77DD;}
button{cursor:pointer;border-radius:8px;padding:6px 14px;border:0.5px solid #ddd;background:#f3f3f0;color:#1a1a1a;}
button:hover{background:#ebebea;}
button.primary{background:#7F77DD;border-color:#7F77DD;color:#fff;font-weight:500;}
button.green{background:#1D9E75;border-color:#1D9E75;color:#fff;}
button.blue{background:#378ADD;border-color:#378ADD;color:#fff;}
button.red-btn{background:#D85A30;border-color:#D85A30;color:#fff;}
button.danger{background:none;border:none;color:#c00;font-size:11px;padding:2px 4px;opacity:0.7;}
button.danger:hover{opacity:1;}
.card{background:#fff;border:0.5px solid #e5e5e2;border-radius:12px;padding:16px 20px;}
.tag{font-size:10px;background:#f3f3f0;border:0.5px solid #ddd;border-radius:20px;padding:2px 8px;color:#666;white-space:nowrap;display:inline-block;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:#fff;border-radius:12px;padding:20px;width:420px;max-height:90vh;overflow-y:auto;}
.status-bar{font-size:12px;padding:6px 20px;background:#f3f3f0;border-bottom:0.5px solid #e5e5e2;color:#666;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useRef,useCallback,useEffect}=React;

const initials=n=>(n||"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avatarColor=n=>{const h=[...(n||"")].reduce((a,c)=>a+c.charCodeAt(0),0);return["#7F77DD","#1D9E75","#D85A30","#378ADD","#D4537E","#639922","#BA7517"][h%7];};
const fmtDate=d=>{if(!d)return"";const dt=new Date(d+"T00:00:00");return isNaN(dt)?d:dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});};
const daysAgo=d=>{if(!d)return"";const n=Math.floor((Date.now()-new Date(d+"T00:00:00"))/86400000);return n===0?"Today":n===1?"Yesterday":`${n}d ago`;};
const toIso=d=>{
  if(!d)return"";
  const t=new Date(d);
  if(!isNaN(t))return t.toISOString().slice(0,10);
  const clean=d.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+/i,"");
  const t2=new Date(clean);
  if(!isNaN(t2))return t2.toISOString().slice(0,10);
  return"";
};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Mo","Tu","We","Th","Fr","Sa","Su"];

const GROUP_ICONS={
  "Beirut":{t:"e",e:"🌲"},"Boston":{t:"e",e:"⚾"},"Bridgespan":{t:"e",e:"🌉"},
  "California":{t:"e",e:"🌴"},"Climate":{t:"e",e:"☀️"},"Colombia":{t:"e",e:"💃"},
  "CrossBoundary":{t:"e",e:"🌐"},"Dubai":{t:"e",e:"✈️"},"Duke":{t:"e",e:"🔵"},
  "Egypt":{t:"e",e:"🐫"},"Gems":{t:"e",e:"💎"},"Goldman Sachs":{t:"e",e:"♠️"},
  "HBS":{t:"e",e:"📕"},"India":{t:"e",e:"🐘"},"Infrastructure":{t:"e",e:"🏗️"},
  "Investment Banking":{t:"e",e:"🤝"},"Investors":{t:"e",e:"📉"},"Jusoor":{t:"e",e:"❤️"},
  "London":{t:"e",e:"👑"},"Morgan Stanley":{t:"e",e:"💙"},"New York":{t:"e",e:"🏙️"},
  "Paris":{t:"e",e:"🍷"},"Philanthropy and Nonprofits":{t:"e",e:"🤍"},
  "Private Equity":{t:"e",e:"⚒️"},"Sacred Heart":{t:"e",e:"🌹"},
  "Saudi Arabia":{t:"e",e:"🌙"},"Singapore":{t:"e",e:"🌴"},
  "Syria":{t:"e",e:"💚"},"Venture":{t:"e",e:"🚀"},"Washington DC":{t:"e",e:"🏛️"}
};

function GIcon({name,size=20}){
  const g=GROUP_ICONS[name]||{t:"e",e:"🏷️"};
  if(g.t==="f")return<img src={`https://flagcdn.com/${size*2}x${size*2}/${g.c}.png`} style={{width:size,height:size,objectFit:"cover",borderRadius:3}} alt={name}/>;
  return<span style={{fontSize:size}}>{g.e}</span>;
}

function parseCSV(text){
  const rows=[];
  let cur="",inQ=false,fields=[],i=0;
  while(i<text.length){
    const c=text[i];
    if(c==='"'){
      if(inQ&&text[i+1]==='"'){cur+='"';i+=2;continue;}
      inQ=!inQ;i++;continue;
    }
    if(c===','&&!inQ){fields.push(cur);cur="";i++;continue;}
    if((c==='\n'||c==='\r')&&!inQ){
      if(c==='\r'&&text[i+1]==='\n')i++;
      fields.push(cur);rows.push(fields);fields=[];cur="";i++;continue;
    }
    cur+=c;i++;
  }
  if(cur||fields.length){fields.push(cur);rows.push(fields);}
  if(!rows.length)return[];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(f=>f.trim())).map(r=>{
    const obj={};headers.forEach((h,i)=>{obj[h]=(r[i]||"").trim();});return obj;
  });
}

function MiniCalendar({value,onChange}){
  const today=new Date();
  const [view,setView]=useState(()=>{const d=value?new Date(value+"T00:00:00"):today;return{y:d.getFullYear(),m:d.getMonth()};});
  const offset=(new Date(view.y,view.m,1).getDay()+6)%7;
  const dim=new Date(view.y,view.m+1,0).getDate();
  const cells=Array(offset).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
  while(cells.length%7!==0)cells.push(null);
  const sel=value?new Date(value+"T00:00:00"):null;
  const isT=d=>d&&today.getFullYear()===view.y&&today.getMonth()===view.m&&today.getDate()===d;
  const isS=d=>sel&&sel.getFullYear()===view.y&&sel.getMonth()===view.m&&sel.getDate()===d;
  const pick=d=>{if(!d)return;onChange(`${view.y}-${String(view.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);};
  return(
    <div style={{background:"#fff",border:"0.5px solid #ddd",borderRadius:12,padding:12,width:240,position:"absolute",zIndex:50,top:"calc(100% + 4px)",left:0,boxShadow:"0 4px 16px rgba(0,0,0,0.1)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <button onClick={()=>setView(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>‹</button>
        <span style={{fontSize:13,fontWeight:500}}>{MONTHS[view.m]} {view.y}</span>
        <button onClick={()=>setView(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"#999",padding:"2px 0"}}>{d}</div>)}
        {cells.map((d,i)=><div key={i} onClick={()=>pick(d)} style={{textAlign:"center",fontSize:12,padding:"4px 2px",borderRadius:6,cursor:d?"pointer":"default",background:isS(d)?"#7F77DD":isT(d)?"#f3f3f0":"transparent",color:isS(d)?"#fff":d?"#1a1a1a":"transparent",fontWeight:isS(d)||isT(d)?500:400}}>{d||""}</div>)}
      </div>
    </div>
  );
}

function DatePicker({value,onChange,placeholder="Pick a date"}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:"relative",display:"inline-block"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{background:"#f3f3f0",border:"0.5px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:13,color:value?"#1a1a1a":"#999",width:"auto"}}>{value?fmtDate(value):placeholder}</button>
      {open&&<MiniCalendar value={value} onChange={v=>{onChange(v);setOpen(false);}}/>}
    </div>
  );
}

function IntCard({i,contacts,contactName,deleteInteraction,setSelected,setTab}){
  const [showDel,setShowDel]=useState(false);
  return(
    <div className="card" style={{padding:"12px 16px"}}>
      <div style={{fontSize:11,color:"#999",marginBottom:3}}>
        {fmtDate(i.date)}
        {i.type&&i.type!=="Manual"&&<span className="tag" style={{marginLeft:6}}>{i.type}</span>}
      </div>
      <div style={{fontWeight:500,fontSize:14,cursor:"pointer",marginBottom:i.note?5:0,color:"#1a1a1a"}}
        onClick={()=>{const c=contacts.find(c=>c.id===(i.personId||i.person_id));if(c){setSelected(c);setTab("contacts");}}}>
        {contactName(i.personId||i.person_id)}
      </div>
      {i.note&&<div style={{fontSize:13,color:"#444",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{i.note}</div>}
      <div style={{marginTop:6,display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8}}>
        {showDel&&<button className="danger" onClick={()=>deleteInteraction(i)}>🗑 Confirm delete</button>}
        <button onClick={()=>setShowDel(s=>!s)} style={{fontSize:11,color:"#ccc",border:"none",background:"none",padding:0,cursor:"pointer"}}>{showDel?"cancel":"⋯"}</button>
      </div>
    </div>
  );
}

function App(){
  const [contacts,setContacts]=useState([]);
  const [interactions,setInteractions]=useState([]);
  const [groups,setGroups]=useState([]);
  const [imported,setImported]=useState(false);
  const [tab,setTab]=useState("dashboard");
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState("");
  const [filterGroup,setFilterGroup]=useState("All");
  const [overlapA,setOverlapA]=useState("");
  const [overlapB,setOverlapB]=useState("");
  const [calDate,setCalDate]=useState(new Date());
  const [calMode,setCalMode]=useState("month");
  const [dashCalDate,setDashCalDate]=useState(new Date());
  const [dashPopup,setDashPopup]=useState(null);
  const [showAddContact,setShowAddContact]=useState(false);
  const [showAddInteraction,setShowAddInteraction]=useState(false);
  const [showAddGroup,setShowAddGroup]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [newGroup,setNewGroup]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [recording,setRecording]=useState(false);
  const [mediaRec,setMediaRec]=useState(null);
  const [detailNote,setDetailNote]=useState("");
  const [syncStatus,setSyncStatus]=useState("");
  const [syncing,setSyncing]=useState(false);
  const [sbUrl,setSbUrl]=useState(()=>localStorage.getItem("sb_url")||"");
  const [sbKey,setSbKey]=useState(()=>localStorage.getItem("sb_key")||"");
  const [sbUrlInput,setSbUrlInput]=useState("");
  const [sbKeyInput,setSbKeyInput]=useState("");
  const [contactSearch,setContactSearch]=useState("");
  const [loadingDB,setLoadingDB]=useState(false);
  const fileRef=useRef();
  const [cf,setCf]=useState({name:"",company:"",role:"",location:"",email:"",phone:"",groups:[],notes:""});
  const [inf,setInf]=useState({contactIds:[],date:"",note:""});

  useEffect(()=>{if(sbUrl&&sbKey)loadFromSupabase(sbUrl,sbKey);},[]);

  const sbFetch=useCallback(async(url,key,path,method="GET",body=null)=>{
    const h={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"};
    if(method==="POST")h["Prefer"]="resolution=merge-duplicates";
    const opts={method,headers:h};
    if(body)opts.body=JSON.stringify(body);
    const r=await fetch(url+"/rest/v1/"+path,opts);
    if(!r.ok){const e=await r.text();throw new Error(e);}
    return method==="GET"?r.json():null;
  },[]);

  const loadFromSupabase=async(url,key)=>{
    setLoadingDB(true);setSyncStatus("Loading…");
    try{
      const [c,i,g]=await Promise.all([
        sbFetch(url,key,"contacts?select=*&order=name&limit=2000"),
        sbFetch(url,key,"interactions?select=*&order=date.desc&limit=2000"),
        sbFetch(url,key,"groups?select=*&order=name&limit=200")
      ]);
      setContacts(c.map(r=>({...r,groupIds:(r.group_ids||"").split(",").filter(Boolean)})));
      setInteractions(i.map(r=>({...r,personId:r.person_id,note:r.note||r.notes||""})));
      setGroups(g);
      if(g.length){setOverlapA(g[0]?.name||"");setOverlapB(g[1]?.name||"");}
      setImported(true);
      setSyncStatus(`Loaded ${c.length} contacts · ${i.length} interactions · ${g.length} groups ✓`);
    }catch(e){setSyncStatus("Load failed: "+e.message);}
    setLoadingDB(false);
  };

  const connectSupabase=async()=>{
    if(!sbUrlInput.trim()||!sbKeyInput.trim())return;
    const url=sbUrlInput.trim().replace(/\/$/,"");const key=sbKeyInput.trim();
    localStorage.setItem("sb_url",url);localStorage.setItem("sb_key",key);
    setSbUrl(url);setSbKey(key);setShowSettings(false);
    await loadFromSupabase(url,key);
  };

  const syncToSupabase=async()=>{
    if(!sbUrl||!sbKey){setSyncStatus("Connect Supabase first.");return;}
    setSyncing(true);setSyncStatus("Syncing…");
    try{
      const BATCH=50;
      const dedupe=rows=>{const seen=new Set();return rows.filter(r=>{if(!r.id||seen.has(r.id))return false;seen.add(r.id);return true;});};
      const upsert=async(table,rows)=>{const u=dedupe(rows);for(let i=0;i<u.length;i+=BATCH)await sbFetch(sbUrl,sbKey,table,"POST",u.slice(i,i+BATCH));};
      await upsert("groups",groups.map(g=>({id:g.id,name:g.name,description:g.description||"",icon:g.icon||"",people_ids:(g.peopleIds||[]).join(",")})));
      await upsert("contacts",contacts.map(c=>({id:c.id,name:c.name,email:c.email||"",phone:c.phone||"",notes:c.notes||"",date_met:c.dateMet||"",company:c.company||"",role:c.role||"",location:c.location||"",group_ids:(c.groupIds||c.groups||[]).join(",")})));
      await upsert("interactions",interactions.map(i=>({id:i.id,person_id:i.personId||i.person_id||"",type:i.type||"",date:i.date||"",note:i.note||""})));
      setSyncStatus(`Synced ${contacts.length} contacts · ${interactions.length} interactions ✓`);
    }catch(e){setSyncStatus("Sync failed: "+e.message);}
    setSyncing(false);
  };

  const handleImportFiles=async e=>{
    const files=Array.from(e.target.files);
    try{
      const read=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);});
      let pf=null,intf=null,gf=null;
      files.forEach(f=>{const n=f.name.toLowerCase();if(n.includes("people"))pf=f;else if(n.includes("interaction"))intf=f;else if(n.includes("group"))gf=f;});
      if(gf){
        const rows=parseCSV(await read(gf));
        const gl=rows.map(r=>({id:r.Id||r.id,name:r.Name||r.name,description:r.Description||"",icon:r.Icon||"",peopleIds:(r.People||"").split(",").map(s=>s.trim()).filter(Boolean)})).filter(g=>g.name);
        setGroups(gl);
        if(gl.length){setOverlapA(gl[0]?.name||"");setOverlapB(gl[1]?.name||"");}
      }
      if(pf){
        const rows=parseCSV(await read(pf));
        setContacts(rows.map(r=>({id:r.Id||r.id,name:r.Name||r.name||"",email:r.Email||r.email||"",phone:r.Phone||r.phone||"",notes:r.Notes||r.notes||"",dateMet:toIso(r["Date Met"]||""),groupIds:(r.Groups||r.groups||"").split(",").map(s=>s.trim()).filter(Boolean),company:"",role:"",location:""})).filter(c=>c.name));
      }
      if(intf){
        const rows=parseCSV(await read(intf));
        setInteractions(rows.map(r=>({id:r["Id"]||r["id"],personId:r["Person Id"]||r["person_id"]||"",type:r["Type"]||r["type"]||"",date:toIso(r["Date"]||r["date"]||""),note:r["Notes"]||r["notes"]||""})).filter(i=>i.personId&&i.id));
      }
      setImported(true);setSyncStatus("CSVs imported ✓ — hit Sync to save to Supabase");
    }catch(e){alert("Import failed: "+e.message);}
    e.target.value="";
  };

  const contactGroups=useCallback(c=>{
    if(!c)return[];
    return(c.groupIds||c.groups||[]).map(gid=>{const g=groups.find(g=>g.id===gid||g.name===gid);return g?g.name:gid;}).filter(Boolean);
  },[groups]);

  const allGroupNames=useMemo(()=>[...new Set(groups.map(g=>g.name))],[groups]);
  const filteredContacts=useMemo(()=>contacts.filter(c=>{
    const q=search.toLowerCase();
    const cg=contactGroups(c);
    return(!q||c.name.toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q)||(c.company||"").toLowerCase().includes(q))&&(filterGroup==="All"||cg.includes(filterGroup));
  }),[contacts,search,filterGroup,contactGroups]);

  const overlapContacts=useMemo(()=>{
    if(!overlapA||!overlapB)return[];
    return contacts.filter(c=>{const cg=contactGroups(c);return cg.includes(overlapA)&&cg.includes(overlapB);});
  },[contacts,overlapA,overlapB,contactGroups]);

  const contactInts=useCallback(cId=>interactions.filter(i=>(i.personId||i.person_id)===cId).sort((a,b)=>b.date.localeCompare(a.date)),[interactions]);
  const lastInteraction=useCallback(cId=>{const hits=interactions.filter(i=>(i.personId||i.person_id)===cId).map(i=>i.date).filter(Boolean);return hits.length?hits.sort().reverse()[0]:null;},[interactions]);
  const contactName=useCallback(id=>contacts.find(c=>c.id===id)?.name||"Unknown",[contacts]);
  const intsOnDate=useCallback(d=>interactions.filter(i=>i.date===d),[interactions]);
  const groupMemberCount=useCallback(name=>contacts.filter(c=>contactGroups(c).includes(name)).length,[contacts,contactGroups]);
  const sortedGroups=useMemo(()=>[...groups].sort((a,b)=>groupMemberCount(b.name)-groupMemberCount(a.name)),[groups,groupMemberCount]);

  const mostRecentInt=useMemo(()=>{
    if(!interactions.length)return null;
    const i=[...interactions].sort((a,b)=>b.date.localeCompare(a.date))[0];
    return{...i,cName:contacts.find(c=>c.id===(i.personId||i.person_id))?.name||"Unknown"};
  },[interactions,contacts]);

  const deleteContact=c=>{
    if(!window.confirm(`Delete ${c.name}?`))return;
    setContacts(cs=>cs.filter(x=>x.id!==c.id));setSelected(null);
    if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts?id=eq."+c.id,"DELETE").catch(()=>{});
  };
  const deleteInteraction=i=>{
    setInteractions(is=>is.filter(x=>x.id!==i.id));
    if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions?id=eq."+i.id,"DELETE").catch(()=>{});
  };

  const addContact=()=>{
    if(!cf.name.trim())return;
    const nc={...cf,id:"c_"+Date.now(),groupIds:cf.groups,dateMet:"",company:cf.company||"",role:cf.role||"",location:cf.location||""};
    setContacts(cs=>[nc,...cs]);
    if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts","POST",[{id:nc.id,name:nc.name,email:nc.email||"",phone:nc.phone||"",notes:nc.notes||"",date_met:"",company:nc.company,role:nc.role,location:nc.location,group_ids:nc.groupIds.join(",")}]).catch(()=>{});
    setCf({name:"",company:"",role:"",location:"",email:"",phone:"",groups:[],notes:""});setShowAddContact(false);
  };

  const addInteraction=()=>{
    if(!inf.date||inf.contactIds.length===0)return;
    inf.contactIds.forEach(cId=>{
      const ni={id:"i_"+Date.now()+"_"+cId,personId:cId,type:"Manual",date:inf.date,note:inf.note};
      setInteractions(is=>[...is,ni]);
      if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions","POST",[{id:ni.id,person_id:cId,type:"Manual",date:inf.date,note:inf.note}]).catch(()=>{});
    });
    setInf({contactIds:[],date:"",note:""});setShowAddInteraction(false);
  };

  const saveDetailNote=()=>{
    if(!detailNote.trim()||!selected)return;
    const date=new Date().toISOString().slice(0,10);
    const nn=(selected.notes?selected.notes+"\n\n":"")+date+": "+detailNote;
    setContacts(cs=>cs.map(c=>c.id===selected.id?{...c,notes:nn}:c));
    setSelected(s=>({...s,notes:nn}));
    if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts?id=eq."+selected.id,"PATCH",{notes:nn}).catch(()=>{});
    setDetailNote("");
  };

  const handleImageNote=async e=>{
    const file=e.target.files[0];if(!file)return;setAiLoading(true);
    const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
    try{
      const b64=await toB64(file);
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":sbKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},{type:"text",text:"Transcribe any text in this image. Return only the transcribed text."}]}]})});
      const data=await resp.json();
      setDetailNote(n=>{const t=data.content?.map(b=>b.text||"").join("")||"";return n?n+"\n"+t:t;});
    }catch{setDetailNote(n=>n+"\n[Could not read image]");}
    setAiLoading(false);e.target.value="";
  };

  const startRecording=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream);const chunks=[];
      mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());setRecording(false);setDetailNote(n=>n?n+"\n[Voice note]":"[Voice note]");};
      mr.start();setMediaRec(mr);setRecording(true);
    }catch{alert("Microphone access denied.");}
  };

  const prevMonth=()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1));
  const nextMonth=()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1));
  const cy=calDate.getFullYear(),cm=calDate.getMonth();
  const coff=(new Date(cy,cm,1).getDay()+6)%7,cdim=new Date(cy,cm+1,0).getDate();
  const calCells=Array(coff).fill(null).concat(Array.from({length:cdim},(_,i)=>i+1));
  while(calCells.length%7!==0)calCells.push(null);

  const dcy=dashCalDate.getFullYear(),dcm=dashCalDate.getMonth();
  const dcoff=(new Date(dcy,dcm,1).getDay()+6)%7,dcdim=new Date(dcy,dcm+1,0).getDate();
  const dashCells=Array(dcoff).fill(null).concat(Array.from({length:dcdim},(_,i)=>i+1));
  while(dashCells.length%7!==0)dashCells.push(null);

  if(showSettings)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"#f5f5f3"}}>
      <div className="card" style={{maxWidth:460,width:"100%"}}>
        <div style={{fontSize:16,fontWeight:500,marginBottom:4}}>Supabase connection</div>
        <p style={{fontSize:12,color:"#666",marginBottom:20,lineHeight:1.6}}>Credentials saved in your browser only.</p>
        <div style={{fontSize:12,color:"#666",marginBottom:4}}>Project URL</div>
        <input type="password" placeholder="https://xxxx.supabase.co" value={sbUrlInput} onChange={e=>setSbUrlInput(e.target.value)} style={{marginBottom:12}}/>
        <div style={{fontSize:12,color:"#666",marginBottom:4}}>Anon / public key</div>
        <input type="password" placeholder="eyJhbGci…" value={sbKeyInput} onChange={e=>setSbKeyInput(e.target.value)} style={{marginBottom:16}}/>
        <div style={{display:"flex",gap:8}}>
          <button className="primary" onClick={connectSupabase} disabled={loadingDB||!sbUrlInput||!sbKeyInput}>{loadingDB?"Connecting…":"Connect & load"}</button>
          <button onClick={()=>setShowSettings(false)}>Cancel</button>
        </div>
        {syncStatus&&<p style={{fontSize:12,marginTop:12,color:syncStatus.includes("failed")?"#c00":"#1D9E75"}}>{syncStatus}</p>}
      </div>
    </div>
  );

  if(!imported)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"#f5f5f3"}}>
      <div className="card" style={{maxWidth:480,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:28,marginBottom:8}}>📂</div>
        <div style={{fontSize:17,fontWeight:500,marginBottom:8}}>My CRM</div>
        <p style={{fontSize:13,color:"#666",marginBottom:20,lineHeight:1.6}}>Import your Mogul CSVs, or connect Supabase if you've synced before.</p>
        <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
          <label style={{padding:"8px 20px",borderRadius:8,background:"#7F77DD",cursor:"pointer",fontSize:14,color:"#fff",fontWeight:500}}>
            📂 Select CSV files<input type="file" accept=".csv" multiple style={{display:"none"}} onChange={handleImportFiles}/>
          </label>
          <button onClick={()=>{setSbUrlInput(sbUrl);setSbKeyInput(sbKey);setShowSettings(true);}}>Connect Supabase</button>
        </div>
        {loadingDB&&<p style={{fontSize:12,color:"#666",marginTop:12}}>Loading…</p>}
        {syncStatus&&<p style={{fontSize:12,color:"#1D9E75",marginTop:12}}>{syncStatus}</p>}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f5f5f3"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:"0.5px solid #e5e5e2",background:"#fff",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10}}>
          <span style={{fontSize:17,fontWeight:600}}>My CRM</span>
          <span style={{fontSize:12,color:"#999"}}>{contacts.length} contacts · {groups.length} groups</span>

        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>

          ))}

          <button className="blue" style={{padding:"5px 12px"}} onClick={()=>setShowAddInteraction(true)}>+ Interaction</button>
          <label style={{padding:"5px 10px",borderRadius:8,border:"0.5px solid #ddd",background:"#f3f3f0",cursor:"pointer",fontSize:13}}>📂<input type="file" accept=".csv" multiple style={{display:"none"}} onChange={handleImportFiles}/></label>
          <button style={{padding:"5px 10px"}} onClick={()=>{setSbUrlInput(sbUrl);setSbKeyInput(sbKey);setShowSettings(true);}}>⚙️</button>
          <button className="red-btn" style={{padding:"5px 12px",opacity:!sbUrl?0.4:1}} onClick={syncToSupabase} disabled={!sbUrl||syncing}>{syncing?"Syncing…":"☁️ Sync"}</button>
        </div>

      <div style={{flex:1,padding:20,maxWidth:1000,width:"100%",margin:"0 auto"}}>

        {/* DASHBOARD */}
        {tab==="dashboard"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
              <div className="card" style={{textAlign:"center",padding:"20px 16px"}}>

              <div className="card" style={{textAlign:"center",padding:"20px 16px"}}>

              {mostRecentInt?(

                    const hits=intsOnDate(ds);const cnt=hits.length;
                    const isToday=new Date().toDateString()===new Date(ds+"T00:00:00").toDateString();
                    const op=cnt===0?0:cnt===1?0.25:cnt<=3?0.55:0.9;
                    return(
                      <div key={i} onClick={()=>cnt>0&&setDashPopup({date:ds,hits})}

                        <span style={{fontSize:10,color:cnt>0&&op>0.4?"#fff":isToday?"#7F77DD":"#999",fontWeight:isToday?600:400}}>{d}</span>
                        {cnt>0&&<span style={{fontSize:8,color:op>0.4?"rgba(255,255,255,0.8)":"#7F77DD"}}>{cnt}</span>}
                      </div>
                    );

                </div>
                <div style={{marginTop:10,display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontSize:10,color:"#bbb"}}>Less</span>

              <div className="card">
                <div style={{fontWeight:500,fontSize:14,marginBottom:12}}>Groups</div>
                <div style={{display:"flex",flexDirection:"column",gap:0,maxHeight:340,overflowY:"auto"}}>
                  {sortedGroups.map(g=>{
                    const cnt=groupMemberCount(g.name);
                    return(
                      <div key={g.id} onClick={()=>{setFilterGroup(g.name);setTab("contacts");}} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"0.5px solid #f0f0ee",cursor:"pointer"}}>
                        <span style={{width:24,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><GIcon name={g.name} size={18}/></span>
                        <span style={{flex:1,fontSize:13}}>{g.name}</span>
                        <span style={{fontSize:12,color:"#999",fontWeight:500}}>{cnt}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {dashPopup&&(
              <div className="overlay" onClick={()=>setDashPopup(null)}>
                <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                    <span style={{fontWeight:500,fontSize:15}}>{fmtDate(dashPopup.date)}</span>
                    <button onClick={()=>setDashPopup(null)} style={{border:"none",background:"none",fontSize:20,color:"#999",lineHeight:1}}>×</button>
                  </div>
                  {dashPopup.hits.map(h=>(
                    <div key={h.id} style={{borderBottom:"0.5px solid #f0f0ee",paddingBottom:10,marginBottom:10}}>
                      <div style={{fontWeight:500,fontSize:13,color:"#7F77DD",cursor:"pointer",marginBottom:2}} onClick={()=>{const c=contacts.find(c=>c.id===(h.personId||h.person_id));if(c){setSelected(c);setTab("contacts");setDashPopup(null);}}}>
                        {contactName(h.personId||h.person_id)}
                      </div>
                      {h.type&&h.type!=="Manual"&&<span className="tag">{h.type}</span>}
                      {h.note&&<div style={{fontSize:12,color:"#555",marginTop:4,lineHeight:1.5}}>{h.note}</div>}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* CONTACTS LIST */}
        {tab==="contacts"&&!selected&&(
          <div>
            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              <input placeholder="Search name, email…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:180}}/>
              <select value={filterGroup} onChange={e=>setFilterGroup(e.target.value)} style={{width:"auto"}}>
                <option>All</option>
                {allGroupNames.map(g=><option key={g}>{g}</option>)}
              </select>
            </div>
            <div style={{fontSize:12,color:"#999",marginBottom:8}}>{filteredContacts.length} of {contacts.length} shown</div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {filteredContacts.slice(0,100).map(c=>{
                const cg=contactGroups(c);const li=lastInteraction(c.id);
                return(
                  <div key={c.id} onClick={()=>setSelected(c)} className="card" style={{cursor:"pointer",display:"flex",alignItems:"center",gap:12,padding:"9px 14px"}}>
                    <div style={{width:34,height:34,borderRadius:"50%",background:avatarColor(c.name),display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:500,color:"#fff",flexShrink:0}}>{initials(c.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:13}}>{c.name}</div>
                      {c.email&&<div style={{fontSize:11,color:"#999",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}</div>}
                    </div>
                    <div style={{display:"flex",gap:3,flexWrap:"wrap",justifyContent:"flex-end",maxWidth:220}}>
                      {cg.slice(0,3).map(g=><span key={g} className="tag">{g}</span>)}
                      {cg.length>3&&<span style={{fontSize:10,color:"#999"}}>+{cg.length-3}</span>}
                    </div>
                    {li&&<span style={{fontSize:11,color:"#999",whiteSpace:"nowrap",marginLeft:6}}>{daysAgo(li)}</span>}
                  </div>
                );
              })}
              {filteredContacts.length>100&&<p style={{fontSize:12,color:"#999",textAlign:"center",marginTop:8}}>Showing first 100 — refine search to see more.</p>}
            </div>
          </div>
        )}

        {/* CONTACT DETAIL */}
        {tab==="contacts"&&selected&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <button onClick={()=>{setSelected(null);setDetailNote("");}}>← Back</button>
              <button className="danger" onClick={()=>deleteContact(selected)}>🗑 Delete contact</button>
            </div>
            <div className="card">
              <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:16}}>
                <div style={{width:48,height:48,borderRadius:"50%",background:avatarColor(selected.name),display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:500,color:"#fff",flexShrink:0}}>{initials(selected.name)}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:17,fontWeight:500}}>{selected.name}</div>
                  {selected.email&&<div style={{fontSize:12,color:"#666",marginTop:2}}>{selected.email}</div>}
                  {selected.phone&&<div style={{fontSize:12,color:"#666"}}>{selected.phone}</div>}
                  {selected.dateMet&&<div style={{fontSize:11,color:"#999",marginTop:2}}>Met {fmtDate(selected.dateMet)}</div>}
                  <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:8}}>{contactGroups(selected).map(g=><span key={g} className="tag">{g}</span>)}</div>
                </div>
              </div>
              {selected.notes&&<div style={{borderTop:"0.5px solid #e5e5e2",paddingTop:12,marginBottom:14}}><div style={{fontSize:12,fontWeight:500,color:"#666",marginBottom:4}}>Notes</div><div style={{fontSize:13,whiteSpace:"pre-wrap",lineHeight:1.6}}>{selected.notes}</div></div>}

                  <button className="primary" onClick={saveDetailNote} disabled={!detailNote.trim()}>Save</button>
                  <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImageNote}/>

                  {aiLoading&&<span style={{fontSize:12,color:"#999"}}>Processing…</span>}

              <div style={{borderTop:"0.5px solid #e5e5e2",paddingTop:12}}>

          </div>

        {/* INTERACTIONS */}
        {tab==="interactions"&&(
          <div>
            <div style={{fontSize:12,color:"#999",marginBottom:12}}>{interactions.length} total interactions</div>

                <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:3}}>
                  {calCells.map((d,i)=>{
                    if(!d)return<div key={i}/>;
                    const ds=`${cy}-${String(cm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                    const hits=intsOnDate(ds);
                    const isToday=new Date().toDateString()===new Date(ds+"T00:00:00").toDateString();
                    return(
                      <div key={i} style={{minHeight:64,background:"#fff",border:"0.5px solid #e5e5e2",borderRadius:8,padding:"5px 6px"}}>
                        <div style={{fontSize:11,fontWeight:isToday?600:400,color:isToday?"#7F77DD":"#999",marginBottom:3}}>{d}</div>
                        {hits.slice(0,3).map(h=><div key={h.id} style={{fontSize:9,background:"#EEEDFE",color:"#3C3489",borderRadius:3,padding:"1px 4px",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{contactName(h.personId||h.person_id)}</div>)}
                        {hits.length>3&&<div style={{fontSize:9,color:"#999"}}>+{hits.length-3}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {calMode==="week"&&(()=>{
              const dow=(calDate.getDay()+6)%7;
              const mon=new Date(calDate);mon.setDate(calDate.getDate()-dow);
              const wdays=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
              return(
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {wdays.map((d,i)=>{
                    const ds=d.toISOString().slice(0,10);
                    const hits=intsOnDate(ds);
                    const isToday=d.toDateString()===new Date().toDateString();
                    return(
                      <div key={i} className="card" style={{display:"flex",gap:16,alignItems:"flex-start",padding:"9px 14px"}}>
                        <div style={{minWidth:44,textAlign:"right"}}>
                          <div style={{fontSize:10,color:"#999"}}>{DAYS[i]}</div>
                          <div style={{fontSize:18,fontWeight:isToday?600:400,color:isToday?"#7F77DD":"#1a1a1a"}}>{d.getDate()}</div>
                        </div>
                        <div style={{flex:1}}>
                          {hits.length===0&&<span style={{fontSize:12,color:"#999"}}>No interactions</span>}
                          {hits.map(h=>(
                            <div key={h.id} style={{marginBottom:6}}>
                              <span style={{fontWeight:500,fontSize:13,cursor:"pointer"}} onClick={()=>{const c=contacts.find(c=>c.id===(h.personId||h.person_id));if(c){setSelected(c);setTab("contacts");}}}>{contactName(h.personId||h.person_id)}</span>
                              {h.note&&<div style={{fontSize:12,color:"#666",lineHeight:1.5}}>{h.note}</div>}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        )}
      </div>

      {/* ADD CONTACT */}
      {showAddContact&&(
        <div className="overlay">
          <div className="modal">
            <div style={{fontSize:16,fontWeight:500,marginBottom:14}}>Add contact</div>
            {[["name","Name *"],["email","Email"],["phone","Phone"],["company","Company"],["role","Role"],["location","Location"]].map(([k,p])=>(
              <input key={k} placeholder={p} value={cf[k]||""} onChange={e=>setCf(f=>({...f,[k]:e.target.value}))} style={{marginBottom:8}}/>
            ))}
            <div style={{fontSize:12,color:"#666",marginBottom:6,marginTop:4}}>Groups</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {allGroupNames.map(g=><button key={g} onClick={()=>setCf(f=>({...f,groups:f.groups.includes(g)?f.groups.filter(x=>x!==g):[...f.groups,g]}))} style={{background:cf.groups.includes(g)?"#7F77DD":"#f3f3f0",color:cf.groups.includes(g)?"#fff":"#1a1a1a",border:"0.5px solid "+(cf.groups.includes(g)?"#7F77DD":"#ddd"),fontSize:12}}>{g}</button>)}
              <button onClick={()=>setShowAddGroup(true)} style={{fontSize:12}}>+ New</button>
            </div>
            {showAddGroup&&<div style={{display:"flex",gap:6,marginBottom:8}}><input placeholder="Group name" value={newGroup} onChange={e=>setNewGroup(e.target.value)} style={{flex:1}}/><button className="primary" onClick={()=>{if(newGroup.trim()){setGroups(g=>[...g,{id:"g_"+Date.now(),name:newGroup.trim(),peopleIds:[]}]);setNewGroup("");setShowAddGroup(false);}}}>Add</button></div>}
            <textarea placeholder="Notes" value={cf.notes} onChange={e=>setCf(f=>({...f,notes:e.target.value}))} rows={3} style={{resize:"vertical",marginBottom:12}}/>
            <div style={{display:"flex",gap:8}}>
              <button className="primary" onClick={addContact} disabled={!cf.name.trim()}>Save</button>
              <button onClick={()=>setShowAddContact(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD INTERACTION */}
      {showAddInteraction&&(
        <div className="overlay">
          <div className="modal">
            <div style={{fontSize:16,fontWeight:500,marginBottom:14}}>Log interaction</div>
            <div style={{fontSize:12,color:"#666",marginBottom:6}}>Date</div>
            <div style={{marginBottom:12,position:"relative"}}><DatePicker value={inf.date} onChange={v=>setInf(f=>({...f,date:v}))}/></div>
            <div style={{fontSize:12,color:"#666",marginBottom:6}}>People</div>
            <input placeholder="Filter contacts…" value={contactSearch} onChange={e=>setContactSearch(e.target.value)} style={{marginBottom:6}}/>
            <div style={{maxHeight:160,overflowY:"auto",border:"0.5px solid #ddd",borderRadius:8,padding:8,marginBottom:12}}>
              {contacts.filter(c=>!contactSearch||c.name.toLowerCase().includes(contactSearch.toLowerCase())).slice(0,50).map(c=>(
                <label key={c.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,padding:"3px 0"}}>
                  <input type="checkbox" checked={inf.contactIds.includes(c.id)} onChange={()=>setInf(f=>({...f,contactIds:f.contactIds.includes(c.id)?f.contactIds.filter(x=>x!==c.id):[...f.contactIds,c.id]}))} style={{width:"auto"}}/>
                  {c.name}
                </label>
              ))}
            </div>
            <textarea placeholder="Notes (optional)" value={inf.note} onChange={e=>setInf(f=>({...f,note:e.target.value}))} rows={3} style={{resize:"vertical",marginBottom:12}}/>
            <div style={{display:"flex",gap:8}}>
              <button className="primary" onClick={addInteraction} disabled={!inf.date||inf.contactIds.length===0}>Save</button>
              <button onClick={()=>setShowAddInteraction(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
