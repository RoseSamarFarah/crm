      // ---- shared styles (Collective tokens) ----
      const hc={padding:"6px 10px",fontSize:10,letterSpacing:"0.04em",textTransform:"uppercase",color:"#8a8a8a",fontWeight:600,background:"#f7f7f5",borderBottom:"1px solid #e2e2e0",textAlign:"right",whiteSpace:"nowrap"};

      const Box=({val,lbl,note,green,last})=>(
        <div style={{padding:"18px 20px",borderRight:last?"none":"1px solid #f0f0ee",background:"#fff"}}>

          <div style={{fontSize:10,letterSpacing:"0.05em",textTransform:"uppercase",color:"#8a8a8a",fontWeight:600,marginTop:8}}>{lbl}</div>
          {note&&<div style={{fontSize:10,color:"#bbb",marginTop:3}}>{note}</div>}
        </div>);
      return <div style={{maxWidth:1180,margin:"0 auto"}}>
      {/* ---------- PRIMARY BASIS BANNER ---------- */}
      <div className="card" style={{padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",borderLeft:"3px solid #256b45"}}>
        <span style={pchip}>Primary basis</span>
        <span style={{fontSize:12.5,fontWeight:600,color:"#1a1a1a"}}>Snoonu precedent multiple {V.txM.toFixed(1)}x on 2026E revenue of {dmoney(proj.r26)}</span>
        <span style={{fontSize:11.5,color:"#8a8a8a"}}>= {dmoney(V.txM*proj.r26)} pre-money</span>
        <span style={{flex:1}}/>
        <span style={{fontSize:10.5,color:"#bbb"}}>{V.primaryOnly?"Trading comps shown below as context — not in the headline":"Field has been edited — headline is the median of ticked bars"}</span>
      </div>
      {/* ---------- IMPLIED VALUATION ---------- */}
      <div className="card" style={{padding:0,overflow:"hidden",marginBottom:12,display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))"}}>
        <Box val={incB.length?dmoney(recLo)+" – "+dmoney(recHi):"—"} lbl="Implied range" note={"±"+Math.round(band*100)+"% band"}/>
        <Box val={recMid!=null?dmoney(recMid):"—"} lbl="Pre-money" note={V.primaryOnly?("Snoonu "+V.txM.toFixed(1)+"x · 2026E rev"):"Median of ticked methods"}/>
        <Box val={"+ "+dmoney(RAISE_M)} lbl="Primary raise" note="Series A"/>
        <Box val={recMid!=null?dmoney(recMid+RAISE_M):"—"} lbl="Post-money" note="Pre-money + raise" green last/>
      </div>
      {/* ---------- COMPANY FINANCIALS ---------- */}
      <div className="card" style={{padding:0,overflow:"hidden",marginBottom:12}}>
        <div style={ph}><span>Company financials <span style={sub}>· $ in millions</span></span><span style={sub}>BeeOrder 2030 Projections · model v3, 18 Aug 2026 · editable</span></div>
        <div className="scroll" style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:520}}>
          <thead><tr><th style={hcL}>Metric</th>{FY.map(y=><th key={y} style={{...hc,background:y==="2026E"?"#eef4f1":"#f7f7f5",color:y==="2026E"?"#256b45":"#8a8a8a"}}>{y}{y==="2026E"?" ◆":""}</th>)}</tr></thead>
          <tbody>
            <tr><td style={lab}>Total GMV</td>{FY.map((y,i)=><td key={i} style={cell}><input value={fin.gmv[i]} onChange={e=>{const a=[...fin.gmv];a[i]=parseFloat(e.target.value)||0;setFin({gmv:a});}} style={nIn}/></td>)}</tr>
            <tr><td style={drv}>GMV growth</td>{FY.map((y,i)=><td key={i} style={dcell}>{pct(grow(fin.gmv,i))}</td>)}</tr>
            <tr><td style={drv}>Marketplace take rate</td>{FY.map((y,i)=><td key={i} style={dcell}>{pct(fin.take[i])}</td>)}</tr>
            <tr><td style={{...lab,fontWeight:700}}>Total sales</td>{FY.map((y,i)=><td key={i} style={{...cell,background:y==="2026E"?"#f4f9f6":"transparent"}}><input value={REVROW[i]} onChange={e=>setProj({[REVKEY[i]]:parseFloat(e.target.value)||0})} style={nIn}/></td>)}</tr>
            <tr><td style={drv}>Revenue growth</td>{FY.map((y,i)=><td key={i} style={dcell}>{pct(grow(REVROW,i))}</td>)}</tr>
            <tr><td style={lab}>Gross profit</td>{FY.map((y,i)=><td key={i} style={cell}><input value={fin.gp[i]} onChange={e=>{const a=[...fin.gp];a[i]=parseFloat(e.target.value)||0;setFin({gp:a});}} style={nIn}/></td>)}</tr>
            <tr><td style={drv}>Gross margin</td>{FY.map((y,i)=><td key={i} style={dcell}>{pct(ratio(fin.gp[i],REVROW[i]))}</td>)}</tr>
            <tr><td style={lab}>EBITDA</td>{FY.map((y,i)=><td key={i} style={cell}><input value={EBROW[i]} onChange={e=>{const v=parseFloat(e.target.value)||0;if(i===0)setFin({e25:v});else setProj({[EBKEY[i-1]]:v});}} style={nIn}/></td>)}</tr>
            <tr><td style={{...drv,borderBottom:"none"}}>EBITDA margin</td>{FY.map((y,i)=><td key={i} style={{...dcell,borderBottom:"none"}}>{pct(ratio(EBROW[i],REVROW[i]))}</td>)}</tr>
          </tbody>
        </table>
        </div>
        <div style={{padding:"7px 14px",fontSize:10,color:"#bbb",borderTop:"1px solid #f0f0ee"}}>◆ 2026E total sales is the valuation anchor. Italic rows are calculated — they update from the rows above. 2025 and 2026 figures are management accounts; audited accounts run through 2023. Dark stores contribute nothing in 2026 — no store has opened.</div>
      </div>
      {/* ---------- PRECEDENT TRANSACTIONS ---------- */}
      <div className="card" style={{padding:0,overflow:"hidden",marginBottom:12,borderLeft:"3px solid #256b45"}}>
        <div style={ph}><span>Precedent transactions <span style={pchip}>Primary</span> <span style={sub}>· {precOn.length} of {precedents.length} included</span></span><span style={sub}>applied to 2026E revenue</span></div>
        <div className="scroll" style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:620}}>
          <thead><tr><th style={{...hc,width:30}}></th><th style={hcL}>Target</th><th style={{...hc,textAlign:"left"}}>Investor</th><th style={{...hc,width:88}}>Date</th><th style={{...hc,width:88}}>Stake</th><th style={{...hc,width:78}}>EV/Rev</th><th style={{...hc,width:104}}>Implied EV</th><th style={{...hc,width:34}}></th></tr></thead>
          <tbody>
          {precedents.map((p,i)=><tr key={i} style={{opacity:p.off?0.4:1}}>
            <td style={{...cell,textAlign:"center"}}><Chk v={!p.off} onClick={()=>patchPrec(i,{off:!p.off})}/></td>
            <td style={{...lab,padding:"5px 10px 5px 14px"}}><input value={p.n||""} onChange={e=>patchPrec(i,{n:e.target.value})} style={tIn}/></td>
            <td style={{padding:"5px 10px",borderBottom:"1px solid #f0f0ee"}}><input value={p.inv||""} onChange={e=>patchPrec(i,{inv:e.target.value})} placeholder="—" style={tIn}/></td>
            <td style={{padding:"5px 10px",borderBottom:"1px solid #f0f0ee"}}><input value={p.date||""} onChange={e=>patchPrec(i,{date:e.target.value})} placeholder="—" style={{...tIn,textAlign:"right"}}/></td>
            <td style={{padding:"5px 10px",borderBottom:"1px solid #f0f0ee"}}><input value={p.stake||""} onChange={e=>patchPrec(i,{stake:e.target.value})} placeholder="—" style={{...tIn,textAlign:"right"}}/></td>
            <td style={{padding:"5px 10px",borderBottom:"1px solid #f0f0ee"}}><input value={p.mult} onChange={e=>patchPrec(i,{mult:parseFloat(e.target.value)||0})} style={{...tIn,textAlign:"right"}}/></td>
            <td style={{...cell,color:p.off?"#bbb":"#256b45",fontWeight:600}}>{(typeof p.mult==="number"&&p.mult>0)?dmoney(p.mult*proj.r26):"—"}</td>
            <td style={{...cell,textAlign:"center",padding:"5px 6px"}}><span onClick={()=>delPrec(i)} title="Remove" style={{cursor:"pointer",color:"#c26a6a",fontSize:12}}>✕</span></td>
          </tr>)}
          <tr><td style={{...cell,borderBottom:"none"}}></td><td colSpan={7} style={{...lab,borderBottom:"none",color:"#4f6ef7",cursor:"pointer",fontWeight:400,padding:"7px 10px 7px 14px"}} onClick={addPrec}>+ Add transaction</td></tr>
          {precMed!=null&&<tr style={{background:"#f4f9f6"}}><td style={{...cell,borderBottom:"none"}}></td><td style={{...lab,borderBottom:"none",fontWeight:700}}>Median <span style={sub}>(incl.)</span></td><td style={{...cell,borderBottom:"none"}}></td><td style={{...cell,borderBottom:"none"}}></td><td style={{...cell,borderBottom:"none"}}></td><td style={{...cell,borderBottom:"none",fontWeight:700}}>{fmtx(precMed)}</td><td style={{...cell,borderBottom:"none",fontWeight:700,color:"#256b45"}}>{dmoney(precMed*proj.r26)}</td><td style={{...cell,borderBottom:"none"}}></td></tr>}
          </tbody>
        </table>
        </div>
        <div style={{padding:"7px 14px",fontSize:10,color:"#bbb",borderTop:"1px solid #f0f0ee"}}>This is the headline valuation basis: the Snoonu multiple applied to <b style={{color:"#8a8a8a"}}>2026E revenue of {dmoney(proj.r26)}</b>. Note for diligence — the multiple is trailing at announcement and is here applied to a forward year, so it is not a like-for-like comparison; it reads conservative against the forward trading comps below, which is the intent.</div>
      </div>
      {/* ---------- PUBLIC COMPS ---------- */}
      <div className="card" style={{padding:0,overflow:"hidden",marginBottom:12}}>
        <div style={ph}><span>Public comps <span style={sub}>· context only · {allC.filter(on).length} of {allC.length} included</span></span><span style={sub}>{asOf?"CapIQ · as of "+asOf:"not synced yet"}</span></div>
        <div className="scroll" style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:600}}>
          <thead>
            <tr><th style={{...hc,width:30}}></th><th style={hcL}>Company</th><th style={{...hc,textAlign:"center",width:56}}>Model</th><th style={{...hc,textAlign:"center",width:78}}>Set</th><th style={{...hc,borderLeft:"1px solid #e2e2e0"}} colSpan={2}>EV / Revenue</th><th style={{...hc,borderLeft:"1px solid #e2e2e0"}} colSpan={2}>EV / EBITDA</th></tr>
            <tr><th style={hc}></th><th style={hcL}></th><th style={hc}></th><th style={hc}></th>{YRS.map(y=><th key={"r"+y} style={{...hc,borderLeft:y==="2026E"?"1px solid #e2e2e0":"none"}}>{y}</th>)}{YRS.map(y=><th key={"e"+y} style={{...hc,borderLeft:y==="2026E"?"1px solid #e2e2e0":"none"}}>{y}</th>)}</tr>
          </thead>
          <tbody>
          {allC.length===0&&<tr><td colSpan={8} style={{padding:20,textAlign:"center",color:"#bbb",fontSize:11.5}}>No synced comps — in Excel, Refresh then run “Sync to Collective”.</td></tr>}
          {allC.map(c=>{const inc=on(c);return <tr key={c.n} style={{opacity:inc?1:0.4}}>
            <td style={{...cell,textAlign:"center"}}><Chk v={inc} onClick={()=>toggleComp(c.n)}/></td>
            <td style={lab}>{dispName(c.n)}</td>
            <td style={{...cell,textAlign:"center",fontSize:10,fontWeight:600,color:c.m==="MK"?"#256b45":"#9a5a24"}}>{c.m==="MK"?"MKTPL":"1P"}</td>
            <td style={{...dcell,textAlign:"center",fontSize:10}}>{c.t||"—"}</td>
            {YRS.map((y,i)=><td key={"r"+i} style={{...cell,borderLeft:i===0?"1px solid #f0f0ee":"none",color:c.m==="MK"?"#1a1a1a":"#cbcbcb"}}>{c.m==="MK"?fmtx((c.rev||[])[i]):"n/a"}</td>)}
            {YRS.map((y,i)=><td key={"e"+i} style={{...cell,borderLeft:i===0?"1px solid #f0f0ee":"none"}}>{fmtx((c.eb||[])[i])}</td>)}
          </tr>;})}
          {allC.length>0&&<tr style={{background:"#f7f7f5"}}>
            <td style={{...cell,borderBottom:"none"}}></td>
            <td style={{...lab,borderBottom:"none"}}>Median <span style={sub}>(incl.)</span></td>
            <td style={{...cell,borderBottom:"none"}}></td><td style={{...cell,borderBottom:"none"}}></td>
            {YRS.map((y,i)=><td key={"rm"+i} style={{...cell,borderBottom:"none",fontWeight:600,borderLeft:i===0?"1px solid #e2e2e0":"none"}}>{fmtx(medOf(allC,"rev",i))}</td>)}
            {YRS.map((y,i)=><td key={"em"+i} style={{...cell,borderBottom:"none",fontWeight:600,borderLeft:i===0?"1px solid #e2e2e0":"none"}}>{fmtx(medOf(allC,"eb",i))}</td>)}
          </tr>}
          </tbody>
        </table>
        </div>
        <div style={{padding:"7px 14px",fontSize:10,color:"#bbb",borderTop:"1px solid #f0f0ee"}}>Trading comps are context for the primary basis, not the headline — they sit unticked in the field below. EV/Revenue uses marketplace names only; 1P gross revenue isn’t comparable to marketplace net revenue. Untick a comp to drop it from the median and every bar below.</div>
      </div>
      {/* ---------- FOOTBALL FIELD ---------- */}
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={ph}><span>Football field <span style={sub}>· implied EV ($m)</span></span><span style={{fontSize:11,color:"#666",display:"flex",alignItems:"center",gap:4,fontWeight:400}}>± <input value={Math.round(band*100)} onChange={e=>setBand(Math.max(0,(parseFloat(e.target.value)||0))/100)} style={{width:34,fontSize:11,padding:"2px 4px",textAlign:"right",border:"1px solid #e6e6e3",borderRadius:0}}/>%</span></div>
        <div style={{padding:"11px 14px"}}>
          {bars.length===0&&<div style={{padding:16,textAlign:"center",color:"#bbb",fontSize:11.5}}>Sync comps to build the field.</div>}
          {bars.map((b,i)=>{const inb=barOn(b);const lo=(b.lo/ffMax)*100,hi=(b.hi/ffMax)*100,mid=(b.mid/ffMax)*100;return <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,opacity:inb?1:0.4}}>
            <Chk v={inb} onClick={()=>toggleFf(b.l)}/>
            <div style={{width:150,fontSize:11,color:"#444",flexShrink:0,display:"flex",alignItems:"center",gap:5}}>{b.l}{b.primary&&<span style={pchip}>1°</span>}</div>
            <div style={{flex:1,position:"relative",height:16,background:"#f2f2f0"}}><div style={{position:"absolute",left:lo+"%",width:Math.max(1.5,hi-lo)+"%",top:0,bottom:0,background:b.c,opacity:0.85}}/><div style={{position:"absolute",left:mid+"%",top:-2,bottom:-2,width:2,background:"#141414"}}/></div>
            <div style={{width:104,textAlign:"right",fontSize:10.5,fontVariantNumeric:"tabular-nums",color:"#444",flexShrink:0}}>{dmoney(b.lo)}–{dmoney(b.hi)}</div>
          </div>;})}
          {bars.length>0&&<div style={{display:"flex",gap:8,marginTop:2}}><div style={{width:14}}/><div style={{width:150}}/><div style={{flex:1,position:"relative",height:12}}>{[0,0.5,1].map(f=><span key={f} style={{position:"absolute",left:(f*100)+"%",fontSize:10,color:"#bbb",transform:f===0?"none":(f===1?"translateX(-100%)":"translateX(-50%)"),fontVariantNumeric:"tabular-nums"}}>{dmoney(ffMax*f)}</span>)}</div><div style={{width:104}}/></div>}
        </div>
        {incB.length>0&&<div style={{padding:"10px 14px",borderTop:"1px solid #eee",background:"#f7f7f5"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontSize:10,letterSpacing:"0.06em",textTransform:"uppercase",color:"#8a8a8a",fontWeight:600}}>Implied range (incl.)</span><span style={{fontSize:15,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{dmoney(recLo)} – {dmoney(recHi)}</span></div>
          {recMid!=null&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:3}}><span style={{fontSize:10,letterSpacing:"0.06em",textTransform:"uppercase",color:"#8a8a8a",fontWeight:600}}>Pre-money · {V.primaryOnly?"Snoonu "+V.txM.toFixed(1)+"x on 2026E revenue":"median of ticked methods"}</span><span style={{fontSize:13,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{dmoney(recMid)}</span></div>}
          {recMid!=null&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:3,paddingTop:5,borderTop:"1px dashed #e2e2e0"}}><span style={{fontSize:10,letterSpacing:"0.06em",textTransform:"uppercase",color:"#256b45",fontWeight:600}}>Post-money · +{dmoney(RAISE_M)} raise</span><span style={{fontSize:15,fontWeight:600,color:"#256b45",fontVariantNumeric:"tabular-nums"}}>{dmoney(recMid+RAISE_M)}</span></div>}
        </div>}
        <div style={{padding:"8px 14px",display:"flex",gap:7,borderTop:"1px solid #eee",flexWrap:"wrap"}}>
          <button onClick={showPrimaryOnly} style={{fontSize:11,padding:"5px 10px",background:V.primaryOnly?"#256b45":"#e8e8e4",border:"1px solid "+(V.primaryOnly?"#256b45":"#c8c8c4"),color:V.primaryOnly?"#fff":"#1a1a1a",borderRadius:0,cursor:"pointer",fontWeight:600}}>Primary basis · Snoonu on 2026E</button>
          <button onClick={()=>setDeal(deal.id,{ffOff:methods.filter(m=>!m.fy1).map(m=>m.l)})} style={{fontSize:11,padding:"5px 10px",background:"#e8e8e4",border:"1px solid #c8c8c4",color:"#1a1a1a",borderRadius:0,cursor:"pointer"}}>FY+1 only (2027E)</button>
          <button onClick={()=>setDeal(deal.id,{ffOff:[]})} style={{fontSize:11,padding:"5px 10px",cursor:"pointer"}}>Show all</button>
        </div>
        <div style={{padding:"0 14px 10px",fontSize:10,color:"#bbb"}}>Each bar = implied EV ± {Math.round(band*100)}%; black tick = the implied midpoint. <b style={{color:"#256b45"}}>1°</b> marks the primary basis. Tick additional bars only to sanity-check the headline — the trading comps are undiscounted out-year multiples and read high.</div>
      </div>
      </div>;
    })()}
    </div></div>}
  </div>;
}

const sbFetch=useCallback(async(url,key,path,method="GET",body=null)=>{
const token=localStorage.getItem("sb_auth_token")||key;
const h={"apikey":key,"Authorization":"Bearer "+token,"Content-Type":"application/json"};
if(method==="POST")h["Prefer"]="resolution=merge-duplicates";
if(method==="GET")h["Range"]="0-9999";
const opts={method,headers:h};if(body)opts.body=JSON.stringify(body);
const r=await fetch(url+"/rest/v1/"+path,opts);
if(!r.ok&&r.status!==416){const e=await r.text();throw new Error(e);}
return method==="GET"?r.json():null;
},[]);

const syncToSupabase=async()=>{
if(!sbUrl||!sbKey){setSyncStatus("Connect Supabase first.");return;}
setSyncing(true);setSyncStatus("Syncing…");
try{
const BATCH=50;
const dedupe=rows=>{const seen=new Set();return rows.filter(r=>{if(!r.id||seen.has(r.id))return false;seen.add(r.id);return true;});};
const upsert=async(table,rows)=>{const u=dedupe(rows);for(let i=0;i<u.length;i+=BATCH)await sbFetch(sbUrl,sbKey,table,"POST",u.slice(i,i+BATCH));};
const tryAddCol=async(table,col,type)=>{try{const token=localStorage.getItem("sb_auth_token")||sbKey;await fetch(sbUrl+"/rest/v1/rpc/run_sql",{method:"POST",headers:{"apikey":sbKey,"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({query:`ALTER TABLE ${table} ADD COLUMN IF NOT EXISTS ${col} ${type} DEFAULT ''`})});}catch(e){}};
await Promise.all([tryAddCol("interactions","project_id","text"),tryAddCol("interactions","attachments","text")]);
await upsert("groups",groups.map(g=>({id:g.id,name:g.name,description:g.description||"",icon:g.icon||"",people_ids:(g.peopleIds||[]).join(",")})));
await upsert("contacts",contacts.map(c=>({id:c.id,name:c.name,email:c.email||"",phone:c.phone||"",notes:c.notes||"",date_met:c.dateMet||"",company:c.company||"",role:c.role||"",location:c.location||"",group_ids:(c.groupIds||c.groups||[]).join(",")})));
const intRows=interactions.map(i=>({id:i.id,person_id:(i.personIds||[i.personId||i.person_id]).filter(Boolean)[0]||"",person_ids:(i.personIds||[i.personId||i.person_id]).filter(Boolean).join(","),type:i.type||"",date:i.date||"",note:i.note||"",project_id:i.projectId||"",attachments:JSON.stringify(i.attachments||[])}));
try{await upsert("interactions",intRows);}catch(e){
if(e.message&&e.message.includes("project_id")){const fallback=interactions.map(i=>({id:i.id,person_id:(i.personIds||[i.personId||i.person_id]).filter(Boolean)[0]||"",person_ids:(i.personIds||[i.personId||i.person_id]).filter(Boolean).join(","),type:i.type||"",date:i.date||"",note:i.note||""}));await upsert("interactions",fallback);setSyncStatus("Synced (note: run SQL to enable project tagging)");setSyncing(false);return;}else throw e;
}
await upsert("projects",projects.map(p=>({id:p.id,name:p.name,icon:p.icon||"",parent_id:p.parentId||"",created_at:p.createdAt||""})));
await upsert("tasks",tasks.map(t=>({id:t.id,title:t.title,project_id:t.projectId||"",contact_id:t.contactId||"",due_date:t.dueDate||"",priority:t.priority||"",status:t.status||"todo",notes:t.notes||"",created_at:t.createdAt||""})));
await upsert("time_entries",timeEntries.map(e=>({id:e.id,task_id:e.taskId||"",project_id:e.projectId||"",description:e.description||"",start_time:e.startTime||0,end_time:e.endTime||0,duration:e.duration||0,date:e.date||""})));
try{await upsert("deals",[{id:"__all__",data:JSON.stringify({dealStore,dealIds})}]);}catch(e){}
setSyncStatus("Synced "+contacts.length+" contacts · "+interactions.length+" interactions · "+projects.length+" projects · "+tasks.length+" tasks ✓");
}catch(e){
let msg=e.message||"";
if(msg.includes("project_id")||msg.includes("attachments")){setSyncStatus("Sync partial — add missing columns in Supabase.");}else{setSyncStatus("Sync failed: "+msg);}
}
setSyncing(false);
};

// --- FIX 1: intPersonIds now dedupes by ID (handles "Yousif Damirji & Yousif Damirji" when same ID was added twice) ---
const intPersonIds=useCallback(i=>{let ids=[];if(i.personIds&&i.personIds.length)ids=i.personIds;else if(i.personId)ids=[i.personId];else if(i.person_id)ids=[i.person_id];return[...new Set(ids)];},[]);
// --- FIX 1b: display-layer helper also dedupes by name (case-insensitive) and filters parser garbage chips (emails/sentences). Used in IntCard, calendar, contact detail, mobile. ---
const intPersonIdsForDisplay=useCallback(i=>{
  const rawIds=intPersonIds(i);
  const seen=new Set();
  const result=[];
  for(const pid of rawIds){
    const c=contacts.find(c=>c.id===pid);
    const name=(c?.name||"").trim();
    if(!name){result.push(pid);continue;}
    const lower=name.toLowerCase();
    if(name.includes("@")||/[<>]/.test(name)||lower.startsWith("http"))continue;
    if(seen.has(lower))continue;
    seen.add(lower);
    result.push(pid);
  }
  // Fallback: if strict filter removed everything, at least dedupe by name without the garbage filter so the interaction still shows people
  if(result.length===0&&rawIds.length>0){
    const seen2=new Set();
    for(const pid of rawIds){
      const c=contacts.find(c=>c.id===pid);
      const name=(c?.name||"").trim().toLowerCase();
      if(seen2.has(name))continue;
      seen2.add(name);
      result.push(pid);
    }
  }
  return result;
},[intPersonIds,contacts]);
