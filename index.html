*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif!important;}
body{background:#1a3a2a;color:#1a1a1a;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
input,select,textarea{background:#f3f3f0;border:0.5px solid #ddd;border-radius:8px;padding:8px 12px;color:#1a1a1a;outline:none;width:100%;font-size:16px;}
input:focus,select:focus,textarea:focus{border-color:#4f6ef7;}
button{cursor:pointer;border-radius:8px;padding:6px 14px;border:0.5px solid #ddd;background:#f3f3f0;color:#1a1a1a;}
button:hover{background:#e8e8e8;}
.card{background:#fff;border:none;border-radius:4px;padding:16px 20px;}
.tag{font-size:10px;background:#eef0ff;border-radius:20px;padding:2px 8px;color:#4f6ef7;white-space:nowrap;display:inline-block;font-weight:500;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:4px;padding:20px;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;}
.sbar{font-size:11px;padding:3px 20px;background:#152e22;color:#7a9a86;}
@media(max-width:700px){
.mob-header{flex-direction:column!important;align-items:flex-start!important;gap:8px!important;}
.mob-header>span{font-size:22px!important;}
.mob-header-right{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex!important;gap:6px!important;}
.mob-header-right::-webkit-scrollbar{display:none;}
.mob-header-right>*{flex-shrink:0;}
.card{padding:12px 14px;border-radius:4px;}
.mob-stats{grid-template-columns:repeat(2,1fr)!important;}
.mob-grid-1{grid-template-columns:1fr!important;}
.mob-sidebar-layout{grid-template-columns:1fr!important;min-height:auto!important;}
.mob-sidebar-layout>.mob-sidebar{border-right:none!important;border-bottom:0.5px solid #eee;max-height:160px;overflow-y:auto;}
.mob-contact-row{flex-wrap:wrap;gap:6px!important;}
.mob-contact-row .mob-tags{justify-content:flex-start!important;max-width:none!important;width:100%;padding-left:46px;}
.mob-filter-row{flex-direction:column!important;}
.mob-filter-row>input{min-width:0!important;}
.mob-filter-row>select{width:100%!important;}
}

function parseCSV(text){
const rows=[];let cur="",inQ=false,fields=[],i=0;
while(i<text.length){const c=text[i];if(c==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i+=2;continue;}inQ=!inQ;i++;continue;}if(c===','&&!inQ){fields.push(cur);cur="";i++;continue;}if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&text[i+1]==='\n')i++;fields.push(cur);rows.push(fields);fields=[];cur="";i++;continue;}cur+=c;i++;}
if(cur||fields.length){fields.push(cur);rows.push(fields);}
if(!rows.length)return[];
const headers=rows[0].map(h=>h.trim());
return rows.slice(1).filter(r=>r.some(f=>f.trim())).map(r=>{const obj={};headers.forEach((h,i)=>{obj[h]=(r[i]||"").trim();});return obj;});
}
function MiniCalendar({value,onChange}){
const now=new Date();
const [view,setView]=useState(()=>{const d=value?new Date(value+"T00:00:00"):now;return{y:d.getFullYear(),m:d.getMonth()};});
const offset=(new Date(view.y,view.m,1).getDay()+6)%7;
const dim=new Date(view.y,view.m+1,0).getDate();
const cells=Array(offset).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
while(cells.length%7!==0)cells.push(null);
const sel=value?new Date(value+"T00:00:00"):null;
const isT=d=>d&&now.getFullYear()===view.y&&now.getMonth()===view.m&&now.getDate()===d;
const isS=d=>sel&&sel.getFullYear()===view.y&&sel.getMonth()===view.m&&sel.getDate()===d;
const pick=d=>{if(!d)return;onChange(`${view.y}-${String(view.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);};
return(
<div style={{background:"#fff",border:"0.5px solid #ddd",borderRadius:12,padding:12,width:240,position:"absolute",zIndex:100,top:"calc(100% + 4px)",left:0,boxShadow:"0 4px 20px rgba(0,0,0,0.15)"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
<button onClick={()=>setView(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>‹</button>
<span style={{fontSize:13,fontWeight:500}}>{MONTHS[view.m]} {view.y}</span>
<button onClick={()=>setView(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>›</button>
</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
{DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"#999",padding:"2px 0"}}>{d}</div>)}
{cells.map((d,i)=><div key={i} onClick={()=>pick(d)} style={{textAlign:"center",fontSize:12,padding:"4px 2px",borderRadius:6,cursor:d?"pointer":"default",background:isS(d)?"#4f6ef7":isT(d)?"#f0f3ff":"transparent",color:isS(d)?"#fff":d?"#1a1a1a":"transparent",fontWeight:isS(d)||isT(d)?500:400}}>{d||""}</div>)}
</div>
</div>
);
}

/* ===== PROJECTS TAB COMPONENT ===== */
function ProjectsTab({contacts,projects,setProjects,tasks,setTasks,timeEntries,setTimeEntries,timer,setTimer,sbUrl,sbKey,sbFetch}){
const [subTab,setSubTab]=useState("upcoming");
const [selProject,setSelProject]=useState("all");
const [showAddProject,setShowAddProject]=useState(false);
const [showAddSub,setShowAddSub]=useState(null);
const [showAddTask,setShowAddTask]=useState(false);
const [newProjName,setNewProjName]=useState("");
const [newSubName,setNewSubName]=useState("");
const [expandedProjects,setExpandedProjects]=useState({});
const [taskDraft,setTaskDraft]=useState({title:"",projectId:"",contactId:"",dueDate:"",priority:"",notes:""});
const [editingTask,setEditingTask]=useState(null);
const [editingProjectId,setEditingProjectId]=useState(null);
const [editProjectName,setEditProjectName]=useState("");
const [contactSearch,setContactSearch]=useState("");
const [timePeriod,setTimePeriod]=useState("today");
const PROJECT_COLORS=["#4f6ef7","#1D9E75","#D85A30","#7F77DD","#D4537E","#639922","#BA7517","#378ADD"];
const getProjectColor=(idx)=>PROJECT_COLORS[idx%PROJECT_COLORS.length];
const topProjects=projects.filter(p=>!p.parentId);
const subProjects=pid=>projects.filter(p=>p.parentId===pid);
const projectName=id=>{const p=projects.find(p=>p.id===id);return p?p.name:"";};
const topProjectOf=id=>{const p=projects.find(x=>x.id===id);if(!p)return null;if(!p.parentId)return p;return projects.find(x=>x.id===p.parentId)||p;};
const projectColor=id=>{const tp=topProjectOf(id);if(!tp)return"#999";const idx=topProjects.indexOf(tp);return idx>=0?getProjectColor(idx):"#999";};
const projectPath=id=>{const p=projects.find(x=>x.id===id);if(!p)return"";if(p.parentId){const par=projects.find(x=>x.id===p.parentId);return par?par.name+" · "+p.name:p.name;}return p.name;};
const filteredTasks=useMemo(()=>{
let t=tasks;
if(selProject!=="all"){
const subs=subProjects(selProject).map(s=>s.id);
t=t.filter(x=>x.projectId===selProject||subs.includes(x.projectId));
}
if(subTab==="upcoming")t=t.filter(x=>x.status!=="done");
if(subTab==="completed")t=t.filter(x=>x.status==="done");
return t;
},[tasks,selProject,subTab]);
const tasksBySubProject=useMemo(()=>{
if(selProject==="all"){
const grouped={};
topProjects.forEach(p=>{
const subs=subProjects(p.id);
const projTasks=filteredTasks.filter(t=>t.projectId===p.id);
const subGroups=subs.map(s=>({sub:s,tasks:filteredTasks.filter(t=>t.projectId===s.id)})).filter(sg=>sg.tasks.length>0);
if(projTasks.length>0||subGroups.length>0)grouped[p.id]={project:p,directTasks:projTasks,subGroups};
});
const ungrouped=filteredTasks.filter(t=>!t.projectId||!projects.find(p=>p.id===t.projectId));
if(ungrouped.length>0)grouped["_none"]={project:{id:"_none",name:"No project"},directTasks:ungrouped,subGroups:[]};
return grouped;
}
const proj=projects.find(p=>p.id===selProject);
if(!proj)return{};
const subs=subProjects(selProject);
const directTasks=filteredTasks.filter(t=>t.projectId===selProject);
const subGroups=subs.map(s=>({sub:s,tasks:filteredTasks.filter(t=>t.projectId===s.id)}));
return{[selProject]:{project:proj,directTasks,subGroups}};
},[filteredTasks,selProject,projects]);
const openTaskCount=pid=>{const subs=subProjects(pid).map(s=>s.id);return tasks.filter(t=>t.status!=="done"&&(t.projectId===pid||subs.includes(t.projectId))).length;};
const toggleExpand=pid=>setExpandedProjects(e=>({...e,[pid]:!e[pid]}));
const addProject=()=>{if(!newProjName.trim())return;const np={id:"proj_"+Date.now(),name:newProjName.trim(),parentId:null};setProjects(ps=>[...ps,np]);setNewProjName("");setShowAddProject(false);};
const addSubProject=(parentId)=>{if(!newSubName.trim())return;const ns={id:"proj_"+Date.now(),name:newSubName.trim(),parentId};setProjects(ps=>[...ps,ns]);setNewSubName("");setShowAddSub(null);};
const deleteProject=(pid)=>{if(!window.confirm("Delete this project and all its sub-projects?"))return;const subs=subProjects(pid).map(s=>s.id);setProjects(ps=>ps.filter(p=>p.id!==pid&&p.parentId!==pid));setTasks(ts=>ts.map(t=>[pid,...subs].includes(t.projectId)?{...t,projectId:""}:t));if(selProject===pid)setSelProject("all");};
const renameProject=(pid,newName)=>{if(!newName.trim())return;setProjects(ps=>ps.map(p=>p.id===pid?{...p,name:newName.trim()}:p));setEditingProjectId(null);setEditProjectName("");};
const deleteSubProject=(sid)=>{if(!window.confirm("Delete this sub-project?"))return;setProjects(ps=>ps.filter(p=>p.id!==sid));setTasks(ts=>ts.map(t=>t.projectId===sid?{...t,projectId:""}:t));if(selProject===sid)setSelProject("all");};
const addTask=()=>{if(!taskDraft.title.trim())return;const nt={id:"task_"+Date.now(),title:taskDraft.title.trim(),projectId:taskDraft.projectId||(selProject!=="all"?selProject:""),contactId:taskDraft.contactId,dueDate:taskDraft.dueDate,priority:taskDraft.priority,notes:taskDraft.notes,status:"todo",createdAt:today()};setTasks(ts=>[...ts,nt]);setTaskDraft({title:"",projectId:"",contactId:"",dueDate:"",priority:"",notes:""});setShowAddTask(false);};
const toggleTask=id=>setTasks(ts=>ts.map(t=>t.id===id?{...t,status:t.status==="done"?"todo":"done"}:t));
const deleteTask=id=>setTasks(ts=>ts.filter(t=>t.id!==id));
const saveTask=draft=>{setTasks(ts=>ts.map(t=>t.id===draft.id?{...draft}:t));setEditingTask(null);};
const startTimer=(taskId,desc)=>{
const t=tasks.find(x=>x.id===taskId);
setTimer({running:true,taskId:taskId||null,projectId:t?.projectId||"",description:desc||t?.title||"",startTime:Date.now()});
};
const stopTimer=()=>{
if(!timer.running)return;
const dur=Math.floor((Date.now()-timer.startTime)/1000);
const entry={id:"te_"+Date.now(),taskId:timer.taskId,projectId:timer.projectId,description:timer.description,startTime:timer.startTime,endTime:Date.now(),duration:dur,date:today()};
setTimeEntries(es=>[entry,...es]);
setTimer({running:false,taskId:null,projectId:"",description:"",startTime:null});
};
const filteredTimeEntries=useMemo(()=>{
const now=new Date();
const todayStr=today();
if(timePeriod==="today")return timeEntries.filter(e=>e.date===todayStr);
if(timePeriod==="week"){const d=new Date();d.setDate(d.getDate()-7);const w=d.toISOString().slice(0,10);return timeEntries.filter(e=>e.date>=w);}
if(timePeriod==="month"){const d=new Date();d.setDate(d.getDate()-30);const m=d.toISOString().slice(0,10);return timeEntries.filter(e=>e.date>=m);}
return timeEntries;
},[timeEntries,timePeriod]);
const timeByProject=useMemo(()=>{
const m={};
filteredTimeEntries.forEach(e=>{const tp=topProjectOf(e.projectId);const key=tp?tp.id:"_none";const name=tp?tp.name:"Other";if(!m[key])m[key]={name,dur:0,color:projectColor(e.projectId)};m[key].dur+=e.duration;});
return Object.values(m).sort((a,b)=>b.dur-a.dur);
},[filteredTimeEntries,projects]);
const totalTime=filteredTimeEntries.reduce((a,e)=>a+e.duration,0);
const priLabel={high:"High",med:"Med",low:"Low"};
const priStyle={high:{background:"rgba(220,60,60,0.08)",color:"#b91c1c"},med:{background:"rgba(180,130,20,0.08)",color:"#92400e"},low:{background:"rgba(79,110,247,0.06)",color:"#6b7280"}};
const sideItemStyle=(active)=>({display:"flex",alignItems:"center",gap:8,padding:"7px 16px",cursor:"pointer",fontSize:13,color:active?"#1a1a1a":"#666",background:active?"#f5f5f3":"transparent",fontWeight:active?500:400,borderRadius:0});
return(
<div>
<div className="card" style={{padding:0,overflow:"hidden"}}>
{/* Tabs */}
<div style={{display:"flex",gap:0,borderBottom:"0.5px solid #eee",padding:"0 20px"}}>
{[["upcoming","Upcoming"],["completed","Completed"],["timelog","Time log"]].map(([k,l])=>(
<div key={k} onClick={()=>setSubTab(k)} style={{fontSize:13,padding:"12px 0",marginRight:24,cursor:"pointer",color:subTab===k?"#1a1a1a":"#999",fontWeight:subTab===k?500:400,borderBottom:subTab===k?"2px solid #1a1a1a":"2px solid transparent"}}>{l}{k==="upcoming"?" ("+tasks.filter(t=>t.status!=="done").length+")":""}</div>
))}
</div>
<div className="mob-sidebar-layout" style={{display:"grid",gridTemplateColumns:"210px minmax(0,1fr)",minHeight:420}}>
{/* Sidebar */}
<div className="mob-sidebar" style={{borderRight:"0.5px solid #eee",padding:"10px 0"}}>
<div style={{fontSize:10,fontWeight:600,color:"#999",padding:"6px 16px 4px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Projects</div>
<div style={sideItemStyle(selProject==="all")} onClick={()=>setSelProject("all")}>
<span style={{fontSize:13}}>All tasks</span>
<span style={{marginLeft:"auto",fontSize:11,color:"#bbb"}}>{tasks.filter(t=>t.status!=="done").length}</span>
</div>
{topProjects.map((p,pi)=>(
<React.Fragment key={p.id}>
{editingProjectId===p.id?(
<div style={{padding:"5px 16px",display:"flex",gap:4,alignItems:"center"}}>
<div style={{width:8,height:8,borderRadius:2,background:getProjectColor(pi),flexShrink:0}}/>
<input value={editProjectName} onChange={e=>setEditProjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameProject(p.id,editProjectName);if(e.key==="Escape"){setEditingProjectId(null);setEditProjectName("");}}} autoFocus style={{fontSize:12,padding:"3px 6px",flex:1}}/>
<button onClick={()=>renameProject(p.id,editProjectName)} style={{fontSize:10,padding:"2px 6px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:4}}>Save</button>
<button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:10,padding:"2px 6px",border:"none",background:"none",color:"#999"}}>✕</button>
</div>
):(
<div style={{...sideItemStyle(selProject===p.id),justifyContent:"flex-start"}} onClick={()=>setSelProject(p.id)}>
<div style={{width:8,height:8,borderRadius:2,background:getProjectColor(pi),flexShrink:0}}/>
<span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
<span style={{fontSize:11,color:"#bbb",flexShrink:0}}>{openTaskCount(p.id)}</span>
<span onClick={e=>{e.stopPropagation();toggleExpand(p.id);}} style={{fontSize:10,color:"#bbb",marginLeft:4,cursor:"pointer",flexShrink:0}}>{expandedProjects[p.id]?"▼":"▶"}</span>
</div>
)}
{expandedProjects[p.id]&&subProjects(p.id).map(s=>(
editingProjectId===s.id?(
<div key={s.id} style={{paddingLeft:36,paddingRight:12,paddingBottom:4,display:"flex",gap:4,alignItems:"center"}}>
<input value={editProjectName} onChange={e=>setEditProjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameProject(s.id,editProjectName);if(e.key==="Escape"){setEditingProjectId(null);setEditProjectName("");}}} autoFocus style={{fontSize:12,padding:"3px 6px",flex:1}}/>
<button onClick={()=>renameProject(s.id,editProjectName)} style={{fontSize:10,padding:"2px 6px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:4}}>Save</button>
<button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:10,padding:"2px 6px",border:"none",background:"none",color:"#999"}}>✕</button>
</div>
):(
<div key={s.id} style={{...sideItemStyle(selProject===s.id),paddingLeft:36,fontSize:12}} onClick={()=>setSelProject(s.id)}>
<span style={{flex:1}}>{s.name}</span>
<span style={{fontSize:11,color:"#bbb"}}>{tasks.filter(t=>t.status!=="done"&&t.projectId===s.id).length}</span>
<span onClick={e=>{e.stopPropagation();setEditingProjectId(s.id);setEditProjectName(s.name);}} style={{fontSize:10,color:"#ccc",cursor:"pointer",marginLeft:4}}>✏️</span>
<span onClick={e=>{e.stopPropagation();deleteSubProject(s.id);}} style={{fontSize:10,color:"#ccc",cursor:"pointer",marginLeft:2}}>✕</span>
</div>
)
))}
{expandedProjects[p.id]&&showAddSub===p.id&&(

<button onClick={()=>addSubProject(p.id)} style={{fontSize:11,padding:"4px 8px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Add</button>
</div>
</div>
)}
{expandedProjects[p.id]&&(
<div style={{paddingLeft:36,paddingBottom:4}}>
<span onClick={()=>setShowAddSub(showAddSub===p.id?null:p.id)} style={{fontSize:11,color:"#4f6ef7",cursor:"pointer"}}>+ Sub-project</span>
<span onClick={()=>{setEditingProjectId(p.id);setEditProjectName(p.name);}} style={{fontSize:11,color:"#ccc",cursor:"pointer",marginLeft:12}}>Rename</span>
<span onClick={()=>deleteProject(p.id)} style={{fontSize:11,color:"#ccc",cursor:"pointer",marginLeft:8}}>Delete</span>
</div>
)}
</React.Fragment>
))}
{showAddProject?(
<div style={{padding:"6px 16px"}}>
<input placeholder="Project name" value={newProjName} onChange={e=>setNewProjName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addProject()} style={{fontSize:12,padding:"5px 8px",marginBottom:4}}/>
<div style={{display:"flex",gap:4}}>
<button onClick={addProject} style={{fontSize:11,padding:"3px 10px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Create</button>
<button onClick={()=>{setShowAddProject(false);setNewProjName("");}} style={{fontSize:11,padding:"3px 10px"}}>Cancel</button>
</div>
</div>
):(

)}
</div>
{/* Main task area */}
<div>
{subTab!=="timelog"&&(
<div>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",borderBottom:"0.5px solid #eee"}}>
{editingProjectId===selProject&&selProject!=="all"?(
<div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>

<button onClick={()=>renameProject(selProject,editProjectName)} style={{fontSize:12,padding:"4px 12px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Save</button>
<button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:12,padding:"4px 8px"}}>Cancel</button>
</div>
):(
<div style={{display:"flex",alignItems:"center",gap:10}}>
<span style={{fontSize:15,fontWeight:500}}>{selProject==="all"?"All tasks":projectName(selProject)}</span>
{selProject!=="all"&&(

</div>
)}
</div>
)}
{selProject!=="all"&&<button onClick={()=>{setShowAddSub(selProject);setExpandedProjects(e=>({...e,[selProject]:true}));}} style={{fontSize:12,color:"#999",background:"none",border:"0.5px solid #ddd",padding:"3px 10px"}}>+ Sub-project</button>}

{!showAddTask?(

const syncToSupabase=async()=>{
if(!sbUrl||!sbKey){setSyncStatus("Connect Supabase first.");return;}
setSyncing(true);setSyncStatus("Syncing…");
try{
const BATCH=50;
const dedupe=rows=>{const seen=new Set();return rows.filter(r=>{if(!r.id||seen.has(r.id))return false;seen.add(r.id);return true;});};
const upsert=async(table,rows)=>{const u=dedupe(rows);for(let i=0;i<u.length;i+=BATCH)await sbFetch(sbUrl,sbKey,table,"POST",u.slice(i,i+BATCH));};
await upsert("groups",groups.map(g=>({id:g.id,name:g.name,description:g.description||"",icon:g.icon||"",people_ids:(g.peopleIds||[]).join(",")})));

await upsert("projects",projects.map(p=>({id:p.id,name:p.name,parent_id:p.parentId||"",created_at:p.createdAt||""})));
await upsert("tasks",tasks.map(t=>({id:t.id,title:t.title,project_id:t.projectId||"",contact_id:t.contactId||"",due_date:t.dueDate||"",priority:t.priority||"",status:t.status||"todo",notes:t.notes||"",created_at:t.createdAt||""})));
await upsert("time_entries",timeEntries.map(e=>({id:e.id,task_id:e.taskId||"",project_id:e.projectId||"",description:e.description||"",start_time:e.startTime||0,end_time:e.endTime||0,duration:e.duration||0,date:e.date||""})));
setSyncStatus("Synced "+contacts.length+" contacts · "+interactions.length+" interactions · "+projects.length+" projects · "+tasks.length+" tasks ✓");
}catch(e){setSyncStatus("Sync failed: "+e.message);}
setSyncing(false);
};

<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
<span style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>{groups.length} groups</span>
<button onClick={()=>{setShowAddGroup(true);setNewGroupIcon("🏷️");}} style={{fontSize:12,padding:"5px 14px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:8,cursor:"pointer",fontWeight:500}}>+ Group</button>
</div>
{showAddGroup&&(
<div className="card" style={{marginBottom:12,padding:"14px 18px"}}>
<div style={{display:"flex",gap:8,alignItems:"center"}}>
<div style={{position:"relative"}}><button onClick={()=>setShowEmojiPicker(showEmojiPicker==="new"?null:"new")} style={{fontSize:22,background:"#f3f3f0",border:"0.5px solid #ddd",borderRadius:8,padding:"4px 8px",cursor:"pointer",lineHeight:1}}>{newGroupIcon}</button>
{showEmojiPicker==="new"&&<EmojiPickerPanel onSelect={e=>{setNewGroupIcon(e);setShowEmojiPicker(null);}} onClose={()=>setShowEmojiPicker(null)}/>}
</div>
<input placeholder="Group name" value={newGroup} onChange={e=>setNewGroup(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newGroup.trim()){const gId="g_"+Date.now();setGroups(g=>[...g,{id:gId,name:newGroup.trim(),icon:newGroupIcon,peopleIds:[]}]);setNewGroup("");setNewGroupIcon("🏷️");setShowAddGroup(false);setShowEmojiPicker(null);setBulkAddGroupId(gId);}}} style={{flex:1,fontSize:13}}/>
<button onClick={()=>{if(newGroup.trim()){const gId="g_"+Date.now();setGroups(g=>[...g,{id:gId,name:newGroup.trim(),icon:newGroupIcon,peopleIds:[]}]);setNewGroup("");setNewGroupIcon("🏷️");setShowAddGroup(false);setShowEmojiPicker(null);setBulkAddGroupId(gId);}}} style={{background:"#4f6ef7",border:"none",color:"#fff",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:12}}>Add</button>
<button onClick={()=>{setShowAddGroup(false);setNewGroup("");setShowEmojiPicker(null);}} style={{fontSize:12}}>Cancel</button>
</div>
</div>
)}
<div style={{background:"#fff",borderRadius:4,overflow:"hidden"}}>
{sortedGroups.map((g,idx)=>{const cnt=groupMemberCount(g.name);const isEditing=editingGroupId===g.id;return(
<div key={g.id} style={{display:"flex",alignItems:"center",gap:14,padding:"13px 18px",borderBottom:idx<sortedGroups.length-1?"0.5px solid #f0f0ee":"none",position:"relative"}}>
{isEditing?(<React.Fragment>
<div style={{position:"relative"}}><button onClick={e=>{e.stopPropagation();setShowEmojiPicker(showEmojiPicker===g.id?null:g.id);}} style={{fontSize:22,background:"#f3f3f0",border:"0.5px solid #ddd",borderRadius:8,padding:"4px 8px",cursor:"pointer",lineHeight:1}}>{editGroupIcon||g.icon||DEFAULT_GROUP_ICONS[g.name]||"🏷️"}</button>
{showEmojiPicker===g.id&&<EmojiPickerPanel onSelect={e=>{setEditGroupIcon(e);updateGroupIcon(g.id,e);setShowEmojiPicker(null);}} onClose={()=>setShowEmojiPicker(null)}/>}
</div>
<input value={editGroupName} onChange={e=>setEditGroupName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameGroup(g.id,editGroupName);if(e.key==="Escape"){setEditingGroupId(null);setShowEmojiPicker(null);}}} autoFocus style={{flex:1,fontSize:14,fontWeight:500,padding:"4px 8px"}} onClick={e=>e.stopPropagation()}/>
<button onClick={e=>{e.stopPropagation();renameGroup(g.id,editGroupName);}} style={{fontSize:12,background:"#4f6ef7",border:"none",color:"#fff",padding:"4px 12px",borderRadius:8,cursor:"pointer"}}>Save</button>
<button onClick={e=>{e.stopPropagation();setEditingGroupId(null);setShowEmojiPicker(null);}} style={{fontSize:12}}>Cancel</button>
</React.Fragment>):(<React.Fragment>
<span onClick={()=>{setFilterGroup(g.name);setFilterGroup2("All");goTab("contacts");}} style={{width:28,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}><GIcon name={g.name} icon={g.icon} size={22}/></span>
<span onClick={()=>{setFilterGroup(g.name);setFilterGroup2("All");goTab("contacts");}} style={{flex:1,fontSize:14,fontWeight:500,cursor:"pointer"}}>{g.name}</span>
<span style={{fontSize:13,color:"#999"}}>{cnt}</span>
<div style={{position:"relative"}}><button onClick={e=>{e.stopPropagation();setGroupMenuOpen(groupMenuOpen===g.id?null:g.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",fontSize:16,color:"#bbb",lineHeight:1,letterSpacing:1}}>⋯</button>
{groupMenuOpen===g.id&&(<React.Fragment><div onClick={()=>setGroupMenuOpen(null)} style={{position:"fixed",inset:0,zIndex:99}}/><div style={{position:"absolute",right:0,top:"calc(100% + 2px)",background:"#fff",border:"0.5px solid #ddd",borderRadius:8,boxShadow:"0 4px 16px rgba(0,0,0,0.12)",zIndex:100,overflow:"hidden",minWidth:160}}>
<button onClick={e=>{e.stopPropagation();setGroupMenuOpen(null);setEditingGroupId(g.id);setEditGroupName(g.name);setEditGroupIcon(g.icon||"");}} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:"0.5px solid #f0f0ee"}} onMouseOver={ev=>ev.currentTarget.style.background="#f8f8f6"} onMouseOut={ev=>ev.currentTarget.style.background="none"}>✏️ Rename</button>
<button onClick={e=>{e.stopPropagation();setGroupMenuOpen(null);setShowEmojiPicker(showEmojiPicker===g.id?null:g.id);setEditingGroupId(g.id);setEditGroupName(g.name);setEditGroupIcon(g.icon||"");}} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:"0.5px solid #f0f0ee"}} onMouseOver={ev=>ev.currentTarget.style.background="#f8f8f6"} onMouseOut={ev=>ev.currentTarget.style.background="none"}>😀 Change icon</button>
<button onClick={e=>{e.stopPropagation();setGroupMenuOpen(null);setBulkAddGroupId(g.id);setBulkSelected([]);setBulkSearch("");}} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",fontSize:13,background:"none",border:"none",cursor:"pointer",borderBottom:"0.5px solid #f0f0ee"}} onMouseOver={ev=>ev.currentTarget.style.background="#f8f8f6"} onMouseOut={ev=>ev.currentTarget.style.background="none"}>👥 Add people</button>
<button onClick={e=>{e.stopPropagation();setGroupMenuOpen(null);deleteGroup(g.id);}} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",fontSize:13,color:"#c00",background:"none",border:"none",cursor:"pointer"}} onMouseOver={ev=>ev.currentTarget.style.background="#fef2f2"} onMouseOut={ev=>ev.currentTarget.style.background="none"}>🗑️ Delete</button>
</div></React.Fragment>)}
</div>
</React.Fragment>)}
</div>
);})}
</div>
{/* BULK ADD CONTACTS TO GROUP MODAL */}
{bulkAddGroupId&&(
<div className="overlay" onClick={()=>{setBulkAddGroupId(null);setBulkSelected([]);setBulkSearch("");}}>
<div className="modal" onClick={e=>e.stopPropagation()}>
<div style={{fontSize:16,fontWeight:600,marginBottom:4}}>Add people to {groups.find(x=>x.id===bulkAddGroupId)?.name||"group"}</div>
<div style={{fontSize:12,color:"#999",marginBottom:12}}>Select contacts to add to this group</div>
<input placeholder="Search contacts…" value={bulkSearch} onChange={e=>setBulkSearch(e.target.value)} style={{marginBottom:10}}/>
<div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
{bulkSelected.length>0&&<span style={{fontSize:12,color:"#4f6ef7",fontWeight:500}}>{bulkSelected.length} selected</span>}
{bulkSelected.length>0&&<button onClick={()=>setBulkSelected([])} style={{fontSize:11,color:"#999",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Clear</button>}
</div>
<div style={{maxHeight:320,overflowY:"auto",border:"0.5px solid #eee",borderRadius:8,marginBottom:14}}>
{contacts.filter(c=>!bulkSearch||c.name.toLowerCase().includes(bulkSearch.toLowerCase())||((c.email||"").toLowerCase().includes(bulkSearch.toLowerCase()))||((c.company||"").toLowerCase().includes(bulkSearch.toLowerCase()))).map(c=>{const alreadyIn=(c.groupIds||[]).includes(bulkAddGroupId);const isSel=bulkSelected.includes(c.id);return(
<label key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",borderBottom:"0.5px solid #f5f5f3",cursor:alreadyIn?"default":"pointer",opacity:alreadyIn?0.5:1}}>
<input type="checkbox" checked={isSel||alreadyIn} disabled={alreadyIn} onChange={()=>{if(alreadyIn)return;setBulkSelected(s=>isSel?s.filter(x=>x!==c.id):[...s,c.id]);}} style={{width:"auto",accentColor:"#4f6ef7"}}/>
<div style={{width:32,height:32,borderRadius:"50%",background:avatarColor(c.name),display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:600,color:"#fff",flexShrink:0}}>{initials(c.name)}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
{c.company&&<div style={{fontSize:11,color:"#999"}}>{c.company}</div>}
</div>
{alreadyIn&&<span style={{fontSize:10,color:"#999",flexShrink:0}}>already in group</span>}
</label>
);})}
</div>
<div style={{display:"flex",gap:8}}>
<button onClick={bulkAddToGroup} disabled={bulkSelected.length===0} style={{background:"#4f6ef7",border:"none",color:"#fff",fontWeight:500,padding:"8px 20px",borderRadius:8,cursor:"pointer",opacity:bulkSelected.length===0?0.5:1}}>Add {bulkSelected.length||""} {bulkSelected.length===1?"person":"people"}</button>
<button onClick={()=>{setBulkAddGroupId(null);setBulkSelected([]);setBulkSearch("");}}>Done</button>
</div>
</div>
</div>
)}
</div>
)}
{/* CALENDAR */}
{tab==="calendar"&&(
<div>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
<div style={{display:"flex",alignItems:"center",gap:10}}>
<button onClick={prevMonth} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>‹</button>
<span style={{fontWeight:600,fontSize:15,color:"#fff"}}>{MONTHS[cm]} {cy}</span>
<button onClick={nextMonth} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>›</button>
</div>
<div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
<div style={{display:"flex",gap:5}}>{[{l:"Call/Video",bg:"#dbeafe",t:"#1d4ed8"},{l:"Email/Note",bg:"#dcfce7",t:"#15803d"},{l:"In Person",bg:"#ede9fe",t:"#7c3aed"},{l:"Other",bg:"#f3f4f6",t:"#6b7280"}].map(x=><span key={x.l} style={{fontSize:10,background:x.bg,color:x.t,borderRadius:20,padding:"2px 7px",fontWeight:500}}>{x.l}</span>)}</div>
{["month","week"].map(m=><button key={m} onClick={()=>setCalMode(m)} style={{background:calMode===m?"#4f6ef7":"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontWeight:calMode===m?500:400,fontSize:13}}>{m.charAt(0).toUpperCase()+m.slice(1)}</button>)}
</div>
</div>
{calMode==="month"&&(
<div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>{DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.3)",padding:"3px 0"}}>{d}</div>)}</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:3}}>
{calCells.map((d,i)=>{
if(!d)return React.createElement("div",{key:i});
const ds=cy+"-"+String(cm+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const hits=intsOnDate(ds);
const isToday=new Date().toDateString()===new Date(ds+"T00:00:00").toDateString();
return(<div key={i} style={{minHeight:68,background:"#fff",borderRadius:2,padding:"5px 6px",border:isToday?"2px solid #4f6ef7":"none"}}>
<div style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?"#4f6ef7":"#999",marginBottom:3}}>{d}</div>
{hits.slice(0,3).map(h=>{const col=intColor(h.type);return<div key={h.id} style={{fontSize:9,background:col.bg,color:col.text,borderRadius:3,padding:"1px 4px",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500}}>{contactName(h.personId||h.person_id)}</div>;})}
{hits.length>3&&<div style={{fontSize:9,color:"#999"}}>+{hits.length-3}</div>}
</div>);
})}
</div>
</div>
)}
{calMode==="week"&&(()=>{
const dow=(calDate.getDay()+6)%7;const mon=new Date(calDate);mon.setDate(calDate.getDate()-dow);
const wdays=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
return(<div style={{display:"flex",flexDirection:"column",gap:6}}>
{wdays.map((d,i)=>{const ds=d.toISOString().slice(0,10);const hits=intsOnDate(ds);const isToday=d.toDateString()===new Date().toDateString();return(
<div key={i} className="card" style={{display:"flex",gap:16,alignItems:"flex-start",padding:"10px 14px"}}>
<div style={{minWidth:44,textAlign:"right"}}>
<div style={{fontSize:10,color:"#999"}}>{DAYS[i]}</div>
<div style={{fontSize:18,fontWeight:isToday?700:400,color:isToday?"#4f6ef7":"#1a1a1a"}}>{d.getDate()}</div>
</div>
<div style={{flex:1}}>
{hits.length===0&&<span style={{fontSize:12,color:"#999"}}>No interactions</span>}
{hits.map(h=>{const col=intColor(h.type);return(
<div key={h.id} style={{marginBottom:6}}>
<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
<span style={{fontWeight:500,fontSize:13,cursor:"pointer"}} onClick={()=>{const c=contacts.find(c=>c.id===(h.personId||h.person_id));if(c){setSelected(c);setTab("contacts");}}}>{contactName(h.personId||h.person_id)}</span>
{h.type&&h.type!=="Manual"&&<span style={{fontSize:10,background:col.bg,color:col.text,borderRadius:20,padding:"1px 7px",fontWeight:500}}>{h.type}</span>}
</div>
{h.note&&<div style={{fontSize:12,color:"#666",lineHeight:1.5}}>{h.note}</div>}
</div>
);})}
</div>
</div>
);})}
</div>);
})()}
</div>
)}
</div>
{/* ADD CONTACT MODAL */}
{showAddContact&&(
<div className="overlay">
<div className="modal">
<div style={{fontSize:16,fontWeight:600,marginBottom:14}}>Add contact</div>
{[["name","Name *"],["email","Email"],["phone","Phone"],["company","Company"],["role","Role"],["location","Location"]].map(([k,p])=>(
<input key={k} placeholder={p} value={cf[k]||""} onChange={e=>setCf(f=>({...f,[k]:e.target.value}))} style={{marginBottom:8}}/>
))}
<div style={{fontSize:12,color:"#666",marginBottom:6,marginTop:4}}>Groups</div>
<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
{allGroupNames.map(g=>{const gObj=groups.find(x=>x.name===g);const gId=gObj?gObj.id:g;const has=cf.groups.includes(g)||cf.groups.includes(gId);return<button key={g} onClick={()=>setCf(f=>({...f,groups:has?f.groups.filter(x=>x!==g&&x!==gId):[...f.groups,gId]}))} style={{fontSize:12,padding:"3px 10px",borderRadius:20,border:"0.5px solid "+(has?"#4f6ef7":"#ddd"),background:has?"#4f6ef7":"#fff",color:has?"#fff":"#666",cursor:"pointer"}}>{g}</button>;})}
<button onClick={()=>{setShowAddGroup(true);setNewGroupIcon("🏷️");}} style={{fontSize:12}}>+ New</button>
</div>
{showAddGroup&&<div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}><div style={{position:"relative"}}><button onClick={()=>setShowEmojiPicker(showEmojiPicker==="addContactNew"?null:"addContactNew")} style={{fontSize:20,background:"#f3f3f0",border:"0.5px solid #ddd",borderRadius:8,padding:"3px 6px",cursor:"pointer",lineHeight:1}}>{newGroupIcon}</button>{showEmojiPicker==="addContactNew"&&<EmojiPickerPanel onSelect={e=>{setNewGroupIcon(e);setShowEmojiPicker(null);}} onClose={()=>setShowEmojiPicker(null)}/>}</div><input placeholder="Group name" value={newGroup} onChange={e=>setNewGroup(e.target.value)} style={{flex:1}}/><button onClick={()=>{if(newGroup.trim()){setGroups(g=>[...g,{id:"g_"+Date.now(),name:newGroup.trim(),icon:newGroupIcon,peopleIds:[]}]);setNewGroup("");setNewGroupIcon("🏷️");setShowAddGroup(false);setShowEmojiPicker(null);}}} style={{background:"#4f6ef7",border:"none",color:"#fff",padding:"6px 14px",borderRadius:8,cursor:"pointer"}}>Add</button></div>}
<textarea placeholder="Notes" value={cf.notes} onChange={e=>setCf(f=>({...f,notes:e.target.value}))} rows={3} style={{resize:"vertical",marginBottom:12}}/>
<div style={{display:"flex",gap:8}}>
<button onClick={addContact} disabled={!cf.name.trim()} style={{background:"#4f6ef7",border:"none",color:"#fff",fontWeight:500,padding:"7px 18px",borderRadius:8,cursor:"pointer"}}>Save</button>
<button onClick={()=>setShowAddContact(false)}>Cancel</button>
</div>
</div>
</div>
)}
{/* ADD INTERACTION MODAL */}
{showAddInteraction&&(
<div className="overlay">
<div className="modal">
<div style={{fontSize:16,fontWeight:600,marginBottom:14}}>Log interaction</div>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>Type</div>
<select value={inf.type} onChange={e=>setInf(f=>({...f,type:e.target.value}))} style={{marginBottom:10}}>
<option value="">Select type…</option><option>Video Chat</option><option>Phone</option><option>In Person</option><option>Email</option><option>Note</option>
</select>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>Date</div>
<div style={{marginBottom:10,position:"relative"}}><DatePicker value={inf.date} onChange={v=>setInf(f=>({...f,date:v}))}/></div>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>People</div>
<input placeholder="Filter contacts…" value={contactSearch} onChange={e=>setContactSearch(e.target.value)} style={{marginBottom:6}}/>
<div style={{maxHeight:150,overflowY:"auto",border:"0.5px solid #ddd",borderRadius:8,padding:8,marginBottom:10}}>
{contacts.filter(c=>!contactSearch||c.name.toLowerCase().includes(contactSearch.toLowerCase())).slice(0,50).map(c=>(
<label key={c.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,padding:"3px 0"}}>
<input type="checkbox" checked={inf.contactIds.includes(c.id)} onChange={()=>setInf(f=>({...f,contactIds:f.contactIds.includes(c.id)?f.contactIds.filter(x=>x!==c.id):[...f.contactIds,c.id]}))} style={{width:"auto"}}/>{c.name}
</label>
))}
</div>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>Notes</div>
<textarea placeholder="Add notes…" value={inf.note} onChange={e=>setInf(f=>({...f,note:e.target.value}))} rows={4} style={{resize:"vertical",marginBottom:12}}/>
<div style={{display:"flex",gap:8}}>
<button onClick={addInteraction} disabled={!inf.date||inf.contactIds.length===0} style={{background:"#4f6ef7",border:"none",color:"#fff",fontWeight:500,padding:"7px 18px",borderRadius:8,cursor:"pointer"}}>Save</button>
<button onClick={()=>setShowAddInteraction(false)}>Cancel</button>
</div>
</div>
</div>
)}
{/* WHATSAPP IMPORT MODAL */}
{showWhatsApp&&(
<div className="overlay">
<div className="modal">
<div style={{fontSize:16,fontWeight:600,marginBottom:6}}>Import WhatsApp chat</div>
<p style={{fontSize:12,color:"#666",marginBottom:14,lineHeight:1.6}}>In WhatsApp, open a chat → tap ··· → More → Export chat → Without media. Paste the text below.</p>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>Contact</div>
<select value={waContact} onChange={e=>setWaContact(e.target.value)} style={{marginBottom:10}}>
<option value="">Select contact…</option>
{contacts.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
</select>
<div style={{fontSize:12,color:"#666",marginBottom:4}}>Paste chat export</div>
<textarea value={waText} onChange={e=>setWaText(e.target.value)} rows={8} placeholder="Paste WhatsApp chat text here…" style={{resize:"vertical",marginBottom:12}}/>
<div style={{display:"flex",gap:8}}>
<button onClick={handleWhatsAppImport} disabled={!waContact||!waText.trim()||waLoading} style={{background:"#1D9E75",border:"none",color:"#fff",fontWeight:500,padding:"7px 18px",borderRadius:8,cursor:"pointer"}}>{waLoading?"Processing…":"Import"}</button>
<button onClick={()=>{setShowWhatsApp(false);setWaText("");setWaContact("");}}>Cancel</button>
</div>
</div>
</div>
)}
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
