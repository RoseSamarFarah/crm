
<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Collective</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif!important;}
body{background:#141414;color:#1a1a1a;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
input,select,textarea{background:#f3f3f0;border:0.5px solid #ddd;border-radius:0;padding:8px 12px;color:#1a1a1a;outline:none;width:100%;font-size:16px;}
input:focus,select:focus,textarea:focus{border-color:#4f6ef7;}
button{cursor:pointer;border-radius:0;padding:6px 14px;border:0.5px solid #ddd;background:#f3f3f0;color:#1a1a1a;}
button:hover{background:#e8e8e8;}
.card{background:#fff;border:none;border-radius:0;padding:16px 20px;}
.tag{font-size:10px;background:#eef0ff;border-radius:20px;padding:2px 8px;color:#4f6ef7;white-space:nowrap;display:inline-block;font-weight:500;}
.proj-tag{font-size:10px;background:#fef3c7;border-radius:20px;padding:2px 8px;color:#92400e;white-space:nowrap;display:inline-block;font-weight:500;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:0;padding:20px;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;}
.sbar{font-size:11px;padding:3px 20px;background:#0f0f0f;color:#8a8a8a;}
@keyframes fadeUpIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.anim-letter{display:inline-block;opacity:0;animation:fadeUpIn 0.6s ease-out forwards;}
/* ===== MOBILE STYLES ===== */
.mob-app{display:none;}
@media(max-width:700px){
.desk-app{display:none!important;}
.mob-app{display:flex;flex-direction:column;height:100dvh;height:-webkit-fill-available;background:#f5f5f3;overflow:hidden;}
.mob-app .mob-header-bar{background:#141414;padding:env(safe-area-inset-top,12px) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mob-app .mob-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px;}
.mob-app .mob-tab-bar{display:flex;background:#fff;border-top:0.5px solid #e0e0de;padding:6px 0 env(safe-area-inset-bottom,8px);flex-shrink:0;}
.mob-app .mob-tab-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:6px 0 2px;font-size:10px;color:#999;font-weight:500;border-radius:0;}
.mob-app .mob-tab-bar button.active{color:#141414;}
.mob-app .mob-tab-bar button .tab-icon{font-size:20px;line-height:1;}
.mob-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:0.5px solid #f0f0ee;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0.04);}
.mob-row:active{background:#f8f8f6;}
.mob-section-header{font-size:11px;font-weight:600;color:#999;letter-spacing:0.5px;padding:14px 16px 6px;text-transform:uppercase;}
.mob-detail{background:#fff;min-height:100%;}
.mob-detail-header{padding:16px;display:flex;align-items:center;gap:14;border-bottom:0.5px solid #eee;}
.mob-search{margin:8px 12px;background:#fff;border:0.5px solid #e0e0de;border-radius:0;padding:9px 14px;font-size:15px;}
.mob-fab{position:fixed;bottom:calc(60px + env(safe-area-inset-bottom,8px) + 12px);right:16px;width:52px;height:52px;border-radius:50%;background:#4f6ef7;color:#fff;border:none;font-size:24px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(79,110,247,0.4);z-index:50;-webkit-tap-highlight-color:transparent;}
.mob-fab:active{transform:scale(0.92);}
.mob-back-btn{background:none;border:none;color:#4f6ef7;font-size:15px;padding:0;font-weight:500;display:flex;align-items:center;gap:4px;}
.mob-int-note{font-size:13px;color:#555;line-height:1.5;margin-top:2px;}
.mob-badge{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:500;display:inline-block;}
@keyframes mobSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes mobSlideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
.mob-detail-slide{animation:mobSlideIn 0.25s ease-out;}
}
