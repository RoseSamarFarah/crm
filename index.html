<script type="text/babel">
const {useState,useMemo,useRef,useCallback,useEffect}=React;

const initials=n=>(n||"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avatarColor=n=>{const h=[...(n||"")].reduce((a,c)=>a+c.charCodeAt(0),0);return["#4f6ef7","#1D9E75","#D85A30","#7F77DD","#D4537E","#639922","#BA7517"][h%7];};
const fmtDate=d=>{if(!d)return"";const dt=new Date(d+"T00:00:00");return isNaN(dt)?d:dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});};
const daysAgo=d=>{if(!d)return"";const n=Math.floor((Date.now()-new Date(d+"T00:00:00"))/86400000);return n===0?"Today":n===1?"Yesterday":`${n}d ago`;};
const toIso=d=>{if(!d)return"";const t=new Date(d);if(!isNaN(t))return t.toISOString().slice(0,10);const t2=new Date(d.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+/i,""));return isNaN(t2)?"":t2.toISOString().slice(0,10);};
const today=()=>new Date().toISOString().slice(0,10);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Mo","Tu","We","Th","Fr","Sa","Su"];
const intColor=type=>{const t=(type||"").toLowerCase();if(t.includes("video")||t.includes("phone")||t.includes("call"))return{bg:"#dbeafe",text:"#1d4ed8"};if(t.includes("email")||t.includes("note"))return{bg:"#dcfce7",text:"#15803d"};if(t.includes("person")||t.includes("coffee")||t.includes("lunch")||t.includes("dinner")||t.includes("meeting"))return{bg:"#ede9fe",text:"#7c3aed"};return{bg:"#f3f4f6",text:"#6b7280"};};
const GROUP_ICONS={"Beirut":"🌲","Boston":"⚾","Bridgespan":"🌉","California":"🌴","Climate":"☀️","Colombia":"☕","CrossBoundary":"🌐","Dubai":"✈️","Duke":"🔵","Egypt":"🐪","Gems":"💎","Goldman Sachs":"♠️","HBS":"📕","India":"🕌","Infrastructure":"🏗️","Investment Banking":"🤝","Investors":"📈","Jusoor":"❤️","London":"👑","Morgan Stanley":"💙","New York":"🗽","Paris":"🍷","Philanthropy and Nonprofits":"🤍","Private Equity":"💼","Sacred Heart":"🌹","Saudi Arabia":"🌙","Singapore":"🌴","Syria":"💚","Venture":"🚀","Washington DC":"🏛️"};
const GIcon=({name,size=20})=>React.createElement("span",{style:{fontSize:size,lineHeight:1}},GROUP_ICONS[name]||"🏷️");
const fmtDur=s=>{if(!s||s<0)return"0m";const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=Math.floor(s%60);if(h>0)return h+"h "+String(m).padStart(2,"0")+"m";if(m>0)return m+"m "+String(sec).padStart(2,"0")+"s";return sec+"s";};
const fmtDurShort=s=>{if(!s||s<0)return"0m";const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);if(h>0)return h+"h "+m+"m";return m+"m";};
const fmtTimer=s=>{const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=Math.floor(s%60);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");};

function parseCSV(text){
  const rows=[];let cur="",inQ=false,fields=[],i=0;
  while(i<text.length){const c=text[i];if(c==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i+=2;continue;}inQ=!inQ;i++;continue;}if(c===','&&!inQ){fields.push(cur);cur="";i++;continue;}if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&text[i+1]==='\n')i++;fields.push(cur);rows.push(fields);fields=[];cur="";i++;continue;}cur+=c;i++;}
  if(cur||fields.length){fields.push(cur);rows.push(fields);}
  if(!rows.length)return[];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(f=>f.trim())).map(r=>{const obj={};headers.forEach((h,i)=>{obj[h]=(r[i]||"").trim();});return obj;});
}

function MiniCalendar({value,onChange}){
  const now=new Date();
  const [view,setView]=useState(()=>{const d=value?new Date(value+"T00:00:00"):now;return{y:d.getFullYear(),m:d.getMonth()};});
  const offset=(new Date(view.y,view.m,1).getDay()+6)%7;
  const dim=new Date(view.y,view.m+1,0).getDate();
  const cells=Array(offset).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
  while(cells.length%7!==0)cells.push(null);
  const sel=value?new Date(value+"T00:00:00"):null;
  const isT=d=>d&&now.getFullYear()===view.y&&now.getMonth()===view.m&&now.getDate()===d;
  const isS=d=>sel&&sel.getFullYear()===view.y&&sel.getMonth()===view.m&&sel.getDate()===d;
  const pick=d=>{if(!d)return;onChange(`${view.y}-${String(view.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);};
  return(
    <div style={{background:"#fff",border:"0.5px solid #ddd",borderRadius:12,padding:12,width:240,position:"absolute",zIndex:100,top:"calc(100% + 4px)",left:0,boxShadow:"0 4px 20px rgba(0,0,0,0.15)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <button onClick={()=>setView(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>‹</button>
        <span style={{fontSize:13,fontWeight:500}}>{MONTHS[view.m]} {view.y}</span>
        <button onClick={()=>setView(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1})} style={{background:"none",border:"none",fontSize:16,padding:"2px 6px"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"#999",padding:"2px 0"}}>{d}</div>)}
        {cells.map((d,i)=><div key={i} onClick={()=>pick(d)} style={{textAlign:"center",fontSize:12,padding:"4px 2px",borderRadius:6,cursor:d?"pointer":"default",background:isS(d)?"#4f6ef7":isT(d)?"#f0f3ff":"transparent",color:isS(d)?"#fff":d?"#1a1a1a":"transparent",fontWeight:isS(d)||isT(d)?500:400}}>{d||""}</div>)}
      </div>
    </div>
  );
}

function DatePicker({value,onChange,placeholder="Pick a date"}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:"relative",display:"inline-block"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{background:"#f3f3f0",border:"0.5px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:13,color:value?"#1a1a1a":"#999",width:"auto"}}>{value?fmtDate(value):placeholder}</button>
      {open&&<MiniCalendar value={value} onChange={v=>{onChange(v);setOpen(false);}}/>}
    </div>
  );
}

function IntCard({i,contacts,contactName,deleteInteraction,saveEditInt,setSelected,setTab,onAddReminder}){
  const [showDel,setShowDel]=useState(false);
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(null);
  const [cs,setCs]=useState("");
  const [showReminder,setShowReminder]=useState(false);
  const [reminderDate,setReminderDate]=useState("");
  const [reminderNote,setReminderNote]=useState("");
  const col=intColor(i.type);
  if(editing&&draft){
    return(
      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontSize:12,fontWeight:500,color:"#999",marginBottom:10}}>Edit interaction</div>
        <select value={draft.type||""} onChange={e=>setDraft(d=>({...d,type:e.target.value}))} style={{marginBottom:8}}>
          <option value="">No type</option><option>Video Chat</option><option>Phone</option><option>In Person</option><option>Email</option><option>Note</option>
        </select>
        <div style={{marginBottom:8,position:"relative"}}><DatePicker value={draft.date} onChange={v=>setDraft(d=>({...d,date:v}))}/></div>
        <input placeholder="Filter person…" value={cs} onChange={e=>setCs(e.target.value)} style={{marginBottom:6}}/>
        <div style={{maxHeight:100,overflowY:"auto",border:"0.5px solid #ddd",borderRadius:8,padding:6,marginBottom:8}}>
          {contacts.filter(c=>!cs||c.name.toLowerCase().includes(cs.toLowerCase())).slice(0,30).map(c=>(
            <label key={c.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,padding:"2px 0"}}>
              <input type="radio" checked={(draft.personId||draft.person_id)===c.id} onChange={()=>setDraft(d=>({...d,personId:c.id,person_id:c.id}))} style={{width:"auto"}}/>{c.name}
            </label>
          ))}
        </div>
        <textarea value={draft.note||""} onChange={e=>setDraft(d=>({...d,note:e.target.value}))} rows={3} style={{resize:"vertical",marginBottom:8}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{saveEditInt(draft);setEditing(false);setDraft(null);}} style={{background:"#4f6ef7",border:"none",color:"#fff",fontWeight:500,padding:"6px 16px",borderRadius:8,cursor:"pointer"}}>Save</button>
          <button onClick={()=>{setEditing(false);setDraft(null);}}>Cancel</button>
        </div>
      </div>
    );
  }
  return(
    <div className="card" style={{padding:"12px 16px"}}>
      <div style={{fontSize:11,color:"#999",marginBottom:3,display:"flex",alignItems:"center",gap:6}}>
        {fmtDate(i.date)}
        {i.type&&i.type!=="Manual"&&<span style={{fontSize:10,background:col.bg,color:col.text,borderRadius:20,padding:"1px 8px",fontWeight:500}}>{i.type}</span>}
        {i.reminderDate&&<span style={{fontSize:10,background:"#fef3c7",color:"#92400e",borderRadius:20,padding:"1px 8px",fontWeight:500}}>⏰ {fmtDate(i.reminderDate)}</span>}
      </div>
      <div style={{fontWeight:500,fontSize:14,cursor:"pointer",marginBottom:i.note?5:0,color:"#1a1a1a"}} onClick={()=>{const c=contacts.find(c=>c.id===(i.personId||i.person_id));if(c){setSelected(c);setTab("contacts");}}}>
        {contactName(i.personId||i.person_id)}
      </div>
      {i.note&&<div style={{fontSize:13,color:"#444",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{i.note}</div>}
      {showReminder&&(
        <div style={{marginTop:8,padding:10,background:"#fffbeb",borderRadius:8,border:"0.5px solid #fde68a"}}>
          <div style={{fontSize:12,color:"#92400e",marginBottom:6,fontWeight:500}}>Set follow-up reminder</div>
          <div style={{position:"relative",marginBottom:6}}><DatePicker value={reminderDate} onChange={v=>setReminderDate(v)} placeholder="Reminder date"/></div>
          <input placeholder="Note (optional)" value={reminderNote} onChange={e=>setReminderNote(e.target.value)} style={{marginBottom:8,fontSize:12}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{onAddReminder(i,reminderDate,reminderNote);setShowReminder(false);setReminderDate("");setReminderNote("");}} disabled={!reminderDate} style={{background:"#f59e0b",border:"none",color:"#fff",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontSize:12}}>Set reminder</button>
            <button onClick={()=>setShowReminder(false)} style={{fontSize:12}}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{marginTop:6,display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10}}>
        {showDel&&<button onClick={()=>deleteInteraction(i)} style={{background:"none",border:"none",color:"#c00",fontSize:11,cursor:"pointer"}}>Confirm delete</button>}
        <button onClick={()=>setShowReminder(s=>!s)} style={{fontSize:11,color:"#f59e0b",border:"none",background:"none",padding:0,cursor:"pointer"}}>⏰</button>
        <button onClick={()=>{setDraft({...i});setEditing(true);setShowDel(false);}} style={{fontSize:11,color:"#4f6ef7",border:"none",background:"none",padding:0,cursor:"pointer"}}>✏️ edit</button>
        <button onClick={()=>setShowDel(s=>!s)} style={{fontSize:14,color:"#ccc",border:"none",background:"none",padding:0,cursor:"pointer"}}>{showDel?"✕":"⋯"}</button>
      </div>
    </div>
  );
}

function QuickAdd({contacts,onAdd,onAddContact,allGroupNames,groups}){
  const [mode,setMode]=useState("interaction");
  const [contactId,setContactId]=useState("");
  const [type,setType]=useState("");
  const [date,setDate]=useState(today());
  const [note,setNote]=useState("");
  const [search,setSearch]=useState("");
  const [showPicker,setShowPicker]=useState(false);
  const filtered=contacts.filter(c=>search&&c.name.toLowerCase().includes(search.toLowerCase())).slice(0,6);
  const selC=contacts.find(c=>c.id===contactId);
  const submitInt=()=>{if(!contactId||!date)return;onAdd({contactId,type,date,note});setContactId("");setType("");setDate(today());setNote("");setSearch("");};
  const [cf,setCf]=useState({name:"",email:"",phone:"",company:"",role:"",location:"",groups:[],notes:""});
  const submitContact=()=>{if(!cf.name.trim())return;onAddContact(cf);setCf({name:"",email:"",phone:"",company:"",role:"",location:"",groups:[],notes:""});};
  return(
    <div className="card" style={{padding:"16px 20px",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12}}>
        <span style={{fontSize:10,fontWeight:600,color:"#bbb",letterSpacing:"1px"}}>QUICK ADD</span>
        <span onClick={()=>setMode("interaction")} style={{fontSize:12,fontWeight:mode==="interaction"?500:400,color:mode==="interaction"?"#1a1a1a":"#999",cursor:"pointer",borderBottom:mode==="interaction"?"1.5px solid #1a1a1a":"1.5px solid transparent",paddingBottom:4}}>Interaction</span>
        <span onClick={()=>setMode("contact")} style={{fontSize:12,fontWeight:mode==="contact"?500:400,color:mode==="contact"?"#1a1a1a":"#999",cursor:"pointer",borderBottom:mode==="contact"?"1.5px solid #1a1a1a":"1.5px solid transparent",paddingBottom:4}}>Contact</span>
      </div>
      {mode==="interaction"?(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div style={{position:"relative"}}>
              <input placeholder="Search contact…" value={selC?selC.name:search} onChange={e=>{setSearch(e.target.value);setContactId("");setShowPicker(true);}} onFocus={()=>setShowPicker(true)} style={{fontSize:13}}/>
              {showPicker&&search&&!selC&&filtered.length>0&&(
                <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"0.5px solid #ddd",borderRadius:8,boxShadow:"0 4px 16px rgba(0,0,0,0.1)",zIndex:20,maxHeight:160,overflowY:"auto"}}>
                  {filtered.map(c=>(
                    <div key={c.id} onClick={()=>{setContactId(c.id);setSearch(c.name);setShowPicker(false);}} style={{padding:"8px 12px",fontSize:13,cursor:"pointer",borderBottom:"0.5px solid #f5f5f5"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#f5f5f3"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                      {c.name}
                    </div>
                  ))}
                </div>
              )}
            </div>
            <select value={type} onChange={e=>setType(e.target.value)} style={{fontSize:13}}>
              <option value="">Type</option>
              <option>Video Chat</option><option>Phone</option><option>In Person</option><option>Email</option><option>Note</option>
            </select>
          </div>
          <div style={{marginBottom:8,position:"relative"}}><DatePicker value={date} onChange={v=>setDate(v)}/></div>
          <textarea placeholder="Notes…" value={note} onChange={e=>setNote(e.target.value)} rows={3} style={{resize:"vertical",marginBottom:10,fontSize:13}}/>
          <button onClick={submitInt} disabled={!contactId||!date} style={{background:"#1a1a1a",border:"none",color:"#fff",fontWeight:500,padding:"7px 20px",borderRadius:8,cursor:"pointer",opacity:(!contactId||!date)?0.4:1}}>Add interaction</button>
        </div>
      ):(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <input placeholder="Name *" value={cf.name} onChange={e=>setCf(f=>({...f,name:e.target.value}))} style={{fontSize:13}}/>
            <input placeholder="Email" value={cf.email} onChange={e=>setCf(f=>({...f,email:e.target.value}))} style={{fontSize:13}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <input placeholder="Phone" value={cf.phone} onChange={e=>setCf(f=>({...f,phone:e.target.value}))} style={{fontSize:13}}/>
            <input placeholder="Company" value={cf.company} onChange={e=>setCf(f=>({...f,company:e.target.value}))} style={{fontSize:13}}/>
          </div>
          <textarea placeholder="Notes…" value={cf.notes} onChange={e=>setCf(f=>({...f,notes:e.target.value}))} rows={2} style={{resize:"vertical",marginBottom:10,fontSize:13}}/>
          <button onClick={submitContact} disabled={!cf.name.trim()} style={{background:"#1a1a1a",border:"none",color:"#fff",fontWeight:500,padding:"7px 20px",borderRadius:8,cursor:"pointer",opacity:!cf.name.trim()?0.4:1}}>Add contact</button>
        </div>
      )}
    </div>
  );
}

function ProjectsTab({contacts,projects,setProjects,tasks,setTasks,timeEntries,setTimeEntries,timer,setTimer,sbUrl,sbKey,sbFetch}){
  const [subTab,setSubTab]=useState("upcoming");
  const [selProject,setSelProject]=useState("all");
  const [showAddProject,setShowAddProject]=useState(false);
  const [showAddSub,setShowAddSub]=useState(null);
  const [showAddTask,setShowAddTask]=useState(false);
  const [newProjName,setNewProjName]=useState("");
  const [newSubName,setNewSubName]=useState("");
  const [expandedProjects,setExpandedProjects]=useState({});
  const [taskDraft,setTaskDraft]=useState({title:"",projectId:"",contactId:"",dueDate:"",priority:"",notes:""});
  const [editingTask,setEditingTask]=useState(null);
  const [editingProjectId,setEditingProjectId]=useState(null);
  const [editProjectName,setEditProjectName]=useState("");
  const [contactSearch,setContactSearch]=useState("");
  const [timePeriod,setTimePeriod]=useState("today");

  const PROJECT_COLORS=["#4f6ef7","#1D9E75","#D85A30","#7F77DD","#D4537E","#639922","#BA7517","#378ADD"];
  const getProjectColor=(idx)=>PROJECT_COLORS[idx%PROJECT_COLORS.length];

  const topProjects=projects.filter(p=>!p.parentId);
  const subProjects=pid=>projects.filter(p=>p.parentId===pid);
  const projectName=id=>{const p=projects.find(p=>p.id===id);return p?p.name:"";};
  const topProjectOf=id=>{const p=projects.find(x=>x.id===id);if(!p)return null;if(!p.parentId)return p;return projects.find(x=>x.id===p.parentId)||p;};
  const projectColor=id=>{const tp=topProjectOf(id);if(!tp)return"#999";const idx=topProjects.indexOf(tp);return idx>=0?getProjectColor(idx):"#999";};
  const projectPath=id=>{const p=projects.find(x=>x.id===id);if(!p)return"";if(p.parentId){const par=projects.find(x=>x.id===p.parentId);return par?par.name+" · "+p.name:p.name;}return p.name;};

  const filteredTasks=useMemo(()=>{
    let t=tasks;
    if(selProject!=="all"){
      const subs=subProjects(selProject).map(s=>s.id);
      t=t.filter(x=>x.projectId===selProject||subs.includes(x.projectId));
    }
    if(subTab==="upcoming")t=t.filter(x=>x.status!=="done");
    if(subTab==="completed")t=t.filter(x=>x.status==="done");
    return t;
  },[tasks,selProject,subTab]);

  const tasksBySubProject=useMemo(()=>{
    if(selProject==="all"){
      const grouped={};
      topProjects.forEach(p=>{
        const subs=subProjects(p.id);
        const projTasks=filteredTasks.filter(t=>t.projectId===p.id);
        const subGroups=subs.map(s=>({sub:s,tasks:filteredTasks.filter(t=>t.projectId===s.id)})).filter(sg=>sg.tasks.length>0);
        if(projTasks.length>0||subGroups.length>0)grouped[p.id]={project:p,directTasks:projTasks,subGroups};
      });
      const ungrouped=filteredTasks.filter(t=>!t.projectId||!projects.find(p=>p.id===t.projectId));
      if(ungrouped.length>0)grouped["_none"]={project:{id:"_none",name:"No project"},directTasks:ungrouped,subGroups:[]};
      return grouped;
    }
    const proj=projects.find(p=>p.id===selProject);
    if(!proj)return{};
    const subs=subProjects(selProject);
    const directTasks=filteredTasks.filter(t=>t.projectId===selProject);
    const subGroups=subs.map(s=>({sub:s,tasks:filteredTasks.filter(t=>t.projectId===s.id)}));
    return{[selProject]:{project:proj,directTasks,subGroups}};
  },[filteredTasks,selProject,projects]);

  const openTaskCount=pid=>{const subs=subProjects(pid).map(s=>s.id);return tasks.filter(t=>t.status!=="done"&&(t.projectId===pid||subs.includes(t.projectId))).length;};

  const toggleExpand=pid=>setExpandedProjects(e=>({...e,[pid]:!e[pid]}));

  const addProject=()=>{if(!newProjName.trim())return;const np={id:"proj_"+Date.now(),name:newProjName.trim(),parentId:null};setProjects(ps=>[...ps,np]);setNewProjName("");setShowAddProject(false);};
  const addSubProject=(parentId)=>{if(!newSubName.trim())return;const ns={id:"proj_"+Date.now(),name:newSubName.trim(),parentId};setProjects(ps=>[...ps,ns]);setNewSubName("");setShowAddSub(null);};
  const deleteProject=(pid)=>{if(!window.confirm("Delete this project and all its sub-projects?"))return;const subs=subProjects(pid).map(s=>s.id);setProjects(ps=>ps.filter(p=>p.id!==pid&&p.parentId!==pid));setTasks(ts=>ts.map(t=>[pid,...subs].includes(t.projectId)?{...t,projectId:""}:t));if(selProject===pid)setSelProject("all");};
  const renameProject=(pid,newName)=>{if(!newName.trim())return;setProjects(ps=>ps.map(p=>p.id===pid?{...p,name:newName.trim()}:p));setEditingProjectId(null);setEditProjectName("");};
  const deleteSubProject=(sid)=>{if(!window.confirm("Delete this sub-project?"))return;setProjects(ps=>ps.filter(p=>p.id!==sid));setTasks(ts=>ts.map(t=>t.projectId===sid?{...t,projectId:""}:t));if(selProject===sid)setSelProject("all");};

  const addTask=()=>{if(!taskDraft.title.trim())return;const nt={id:"task_"+Date.now(),title:taskDraft.title.trim(),projectId:taskDraft.projectId||(selProject!=="all"?selProject:""),contactId:taskDraft.contactId,dueDate:taskDraft.dueDate,priority:taskDraft.priority,notes:taskDraft.notes,status:"todo",createdAt:today()};setTasks(ts=>[...ts,nt]);setTaskDraft({title:"",projectId:"",contactId:"",dueDate:"",priority:"",notes:""});setShowAddTask(false);};
  const toggleTask=id=>setTasks(ts=>ts.map(t=>t.id===id?{...t,status:t.status==="done"?"todo":"done"}:t));
  const deleteTask=id=>setTasks(ts=>ts.filter(t=>t.id!==id));
  const saveTask=draft=>{setTasks(ts=>ts.map(t=>t.id===draft.id?{...draft}:t));setEditingTask(null);};

  const startTimer=(taskId,desc)=>{
    const t=tasks.find(x=>x.id===taskId);
    setTimer({running:true,taskId:taskId||null,projectId:t?.projectId||"",description:desc||t?.title||"",startTime:Date.now()});
  };
  const stopTimer=()=>{
    if(!timer.running)return;
    const dur=Math.floor((Date.now()-timer.startTime)/1000);
    const entry={id:"te_"+Date.now(),taskId:timer.taskId,projectId:timer.projectId,description:timer.description,startTime:timer.startTime,endTime:Date.now(),duration:dur,date:today()};
    setTimeEntries(es=>[entry,...es]);
    setTimer({running:false,taskId:null,projectId:"",description:"",startTime:null});
  };

  const filteredTimeEntries=useMemo(()=>{
    const now=new Date();
    const todayStr=today();
    if(timePeriod==="today")return timeEntries.filter(e=>e.date===todayStr);
    if(timePeriod==="week"){const d=new Date();d.setDate(d.getDate()-7);const w=d.toISOString().slice(0,10);return timeEntries.filter(e=>e.date>=w);}
    if(timePeriod==="month"){const d=new Date();d.setDate(d.getDate()-30);const m=d.toISOString().slice(0,10);return timeEntries.filter(e=>e.date>=m);}
    return timeEntries;
  },[timeEntries,timePeriod]);

  const timeByProject=useMemo(()=>{
    const m={};
    filteredTimeEntries.forEach(e=>{const tp=topProjectOf(e.projectId);const key=tp?tp.id:"_none";const name=tp?tp.name:"Other";if(!m[key])m[key]={name,dur:0,color:projectColor(e.projectId)};m[key].dur+=e.duration;});
    return Object.values(m).sort((a,b)=>b.dur-a.dur);
  },[filteredTimeEntries,projects]);

  const totalTime=filteredTimeEntries.reduce((a,e)=>a+e.duration,0);

  const priLabel={high:"High",med:"Med",low:"Low"};
  const priStyle={high:{background:"rgba(220,60,60,0.08)",color:"#b91c1c"},med:{background:"rgba(180,130,20,0.08)",color:"#92400e"},low:{background:"rgba(79,110,247,0.06)",color:"#6b7280"}};

  const sideItemStyle=(active)=>({display:"flex",alignItems:"center",gap:8,padding:"7px 16px",cursor:"pointer",fontSize:13,color:active?"#1a1a1a":"#666",background:active?"#f5f5f3":"transparent",fontWeight:active?500:400,borderRadius:0});

  return(
    <div>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        {/* Tabs */}
        <div style={{display:"flex",gap:0,borderBottom:"0.5px solid #eee",padding:"0 20px"}}>
          {[["upcoming","Upcoming"],["completed","Completed"],["timelog","Time log"]].map(([k,l])=>(
            <div key={k} onClick={()=>setSubTab(k)} style={{fontSize:13,padding:"12px 0",marginRight:24,cursor:"pointer",color:subTab===k?"#1a1a1a":"#999",fontWeight:subTab===k?500:400,borderBottom:subTab===k?"2px solid #1a1a1a":"2px solid transparent"}}>{l}{k==="upcoming"?" ("+tasks.filter(t=>t.status!=="done").length+")":""}</div>
          ))}
        </div>

        <div className="mob-sidebar-layout" style={{display:"grid",gridTemplateColumns:"210px minmax(0,1fr)",minHeight:420}}>
          {/* Sidebar */}
          <div className="mob-sidebar" style={{borderRight:"0.5px solid #eee",padding:"10px 0"}}>
            <div style={{fontSize:10,fontWeight:600,color:"#999",padding:"6px 16px 4px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Projects</div>
            <div style={sideItemStyle(selProject==="all")} onClick={()=>setSelProject("all")}>
              <span style={{fontSize:13}}>All tasks</span>
              <span style={{marginLeft:"auto",fontSize:11,color:"#bbb"}}>{tasks.filter(t=>t.status!=="done").length}</span>
            </div>
            {topProjects.map((p,pi)=>(
              <React.Fragment key={p.id}>
                {editingProjectId===p.id?(
                  <div style={{padding:"5px 16px",display:"flex",gap:4,alignItems:"center"}}>
                    <div style={{width:8,height:8,borderRadius:2,background:getProjectColor(pi),flexShrink:0}}/>
                    <input value={editProjectName} onChange={e=>setEditProjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameProject(p.id,editProjectName);if(e.key==="Escape"){setEditingProjectId(null);setEditProjectName("");}}} autoFocus style={{fontSize:12,padding:"3px 6px",flex:1}}/>
                    <button onClick={()=>renameProject(p.id,editProjectName)} style={{fontSize:10,padding:"2px 6px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:4}}>Save</button>
                    <button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:10,padding:"2px 6px",border:"none",background:"none",color:"#999"}}>✕</button>
                  </div>
                ):(
                <div style={{...sideItemStyle(selProject===p.id),justifyContent:"flex-start"}} onClick={()=>setSelProject(p.id)}>
                  <div style={{width:8,height:8,borderRadius:2,background:getProjectColor(pi),flexShrink:0}}/>
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  <span style={{fontSize:11,color:"#bbb",flexShrink:0}}>{openTaskCount(p.id)}</span>
                  <span onClick={e=>{e.stopPropagation();toggleExpand(p.id);}} style={{fontSize:10,color:"#bbb",marginLeft:4,cursor:"pointer",flexShrink:0}}>{expandedProjects[p.id]?"▼":"▶"}</span>
                </div>
                )}
                {expandedProjects[p.id]&&subProjects(p.id).map(s=>(
                  editingProjectId===s.id?(
                    <div key={s.id} style={{paddingLeft:36,paddingRight:12,paddingBottom:4,display:"flex",gap:4,alignItems:"center"}}>
                      <input value={editProjectName} onChange={e=>setEditProjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameProject(s.id,editProjectName);if(e.key==="Escape"){setEditingProjectId(null);setEditProjectName("");}}} autoFocus style={{fontSize:12,padding:"3px 6px",flex:1}}/>
                      <button onClick={()=>renameProject(s.id,editProjectName)} style={{fontSize:10,padding:"2px 6px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:4}}>Save</button>
                      <button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:10,padding:"2px 6px",border:"none",background:"none",color:"#999"}}>✕</button>
                    </div>
                  ):(
                  <div key={s.id} style={{...sideItemStyle(selProject===s.id),paddingLeft:36,fontSize:12}} onClick={()=>setSelProject(s.id)}>
                    <span style={{flex:1}}>{s.name}</span>
                    <span style={{fontSize:11,color:"#bbb"}}>{tasks.filter(t=>t.status!=="done"&&t.projectId===s.id).length}</span>
                    <span onClick={e=>{e.stopPropagation();setEditingProjectId(s.id);setEditProjectName(s.name);}} style={{fontSize:10,color:"#ccc",cursor:"pointer",marginLeft:4}}>✏️</span>
                    <span onClick={e=>{e.stopPropagation();deleteSubProject(s.id);}} style={{fontSize:10,color:"#ccc",cursor:"pointer",marginLeft:2}}>✕</span>
                  </div>
                  )
                ))}
                {expandedProjects[p.id]&&showAddSub===p.id&&(
                  <div style={{paddingLeft:36,paddingRight:12,paddingBottom:6}}>
                    <div style={{display:"flex",gap:4}}>
                      <input placeholder="Sub-project name" value={newSubName} onChange={e=>setNewSubName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSubProject(p.id)} style={{fontSize:12,padding:"4px 8px",flex:1}}/>
                      <button onClick={()=>addSubProject(p.id)} style={{fontSize:11,padding:"4px 8px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Add</button>
                    </div>
                  </div>
                )}
                {expandedProjects[p.id]&&(
                  <div style={{paddingLeft:36,paddingBottom:4}}>
                    <span onClick={()=>setShowAddSub(showAddSub===p.id?null:p.id)} style={{fontSize:11,color:"#4f6ef7",cursor:"pointer"}}>+ Sub-project</span>
                    <span onClick={()=>{setEditingProjectId(p.id);setEditProjectName(p.name);}} style={{fontSize:11,color:"#ccc",cursor:"pointer",marginLeft:12}}>Rename</span>
                    <span onClick={()=>deleteProject(p.id)} style={{fontSize:11,color:"#ccc",cursor:"pointer",marginLeft:8}}>Delete</span>
                  </div>
                )}
              </React.Fragment>
            ))}
            {showAddProject?(
              <div style={{padding:"6px 16px"}}>
                <input placeholder="Project name" value={newProjName} onChange={e=>setNewProjName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addProject()} style={{fontSize:12,padding:"5px 8px",marginBottom:4}}/>
                <div style={{display:"flex",gap:4}}>
                  <button onClick={addProject} style={{fontSize:11,padding:"3px 10px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Create</button>
                  <button onClick={()=>{setShowAddProject(false);setNewProjName("");}} style={{fontSize:11,padding:"3px 10px"}}>Cancel</button>
                </div>
              </div>
            ):(
              <div onClick={()=>setShowAddProject(true)} style={{fontSize:12,color:"#4f6ef7",cursor:"pointer",padding:"8px 16px"}}>+ New project</div>
            )}
          </div>

          {/* Main task area */}
          <div>
            {subTab!=="timelog"&&(
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",borderBottom:"0.5px solid #eee"}}>
                  {editingProjectId===selProject&&selProject!=="all"?(
                    <div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
                      <input value={editProjectName} onChange={e=>setEditProjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")renameProject(selProject,editProjectName);if(e.key==="Escape"){setEditingProjectId(null);setEditProjectName("");}}} autoFocus style={{fontSize:15,fontWeight:500,padding:"4px 8px",flex:1,maxWidth:300}}/>
                      <button onClick={()=>renameProject(selProject,editProjectName)} style={{fontSize:12,padding:"4px 12px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Save</button>
                      <button onClick={()=>{setEditingProjectId(null);setEditProjectName("");}} style={{fontSize:12,padding:"4px 8px"}}>Cancel</button>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:15,fontWeight:500}}>{selProject==="all"?"All tasks":projectName(selProject)}</span>
                      {selProject!=="all"&&(
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <button onClick={()=>{setEditingProjectId(selProject);setEditProjectName(projectName(selProject));}} style={{fontSize:11,color:"#4f6ef7",background:"none",border:"0.5px solid #4f6ef7",padding:"2px 8px",borderRadius:6,cursor:"pointer"}}>Rename</button>
                          <button onClick={()=>{const p=projects.find(x=>x.id===selProject);if(p&&p.parentId)deleteSubProject(selProject);else deleteProject(selProject);}} style={{fontSize:11,color:"#c00",background:"none",border:"0.5px solid #eee",padding:"2px 8px",borderRadius:6,cursor:"pointer"}}>Delete</button>
                        </div>
                      )}
                    </div>
                  )}
                  {selProject!=="all"&&<button onClick={()=>{setShowAddSub(selProject);setExpandedProjects(e=>({...e,[selProject]:true}));}} style={{fontSize:12,color:"#999",background:"none",border:"0.5px solid #ddd",padding:"3px 10px"}}>+ Sub-project</button>}
                </div>

                {/* Create task row */}
                {!showAddTask?(
                  <div onClick={()=>setShowAddTask(true)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 20px",borderBottom:"0.5px solid #eee",color:"#999",fontSize:13,cursor:"pointer"}}>
                    <span style={{fontSize:16,width:20,textAlign:"center"}}>+</span>Create task
                  </div>
                ):(
                  <div style={{padding:"12px 20px",borderBottom:"0.5px solid #eee",background:"#fafaf8"}}>
                    <input placeholder="Task name" value={taskDraft.title} onChange={e=>setTaskDraft(d=>({...d,title:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter"&&taskDraft.title.trim())addTask();}} style={{marginBottom:8,fontSize:13}}/>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                      <select value={taskDraft.projectId||(selProject!=="all"?selProject:"")} onChange={e=>setTaskDraft(d=>({...d,projectId:e.target.value}))} style={{fontSize:12}}>
                        <option value="">No project</option>
                        {projects.map(p=><option key={p.id} value={p.id}>{p.parentId?"  ↳ ":""}{p.name}</option>)}
                      </select>
                      <select value={taskDraft.priority} onChange={e=>setTaskDraft(d=>({...d,priority:e.target.value}))} style={{fontSize:12}}>
                        <option value="">Priority</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option>
                      </select>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                      <div style={{position:"relative"}}><DatePicker value={taskDraft.dueDate} onChange={v=>setTaskDraft(d=>({...d,dueDate:v}))} placeholder="Due date"/></div>
                      <div style={{position:"relative"}}>
                        <input placeholder="Link contact…" value={contactSearch} onChange={e=>setContactSearch(e.target.value)} style={{fontSize:12}}/>
                        {contactSearch&&(
                          <div style={{position:"absolute",top:"calc(100% + 2px)",left:0,right:0,background:"#fff",border:"0.5px solid #ddd",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,0.1)",zIndex:20,maxHeight:120,overflowY:"auto"}}>
                            {contacts.filter(c=>c.name.toLowerCase().includes(contactSearch.toLowerCase())).slice(0,6).map(c=>(
                              <div key={c.id} onClick={()=>{setTaskDraft(d=>({...d,contactId:c.id}));setContactSearch(c.name);}} style={{padding:"6px 10px",fontSize:12,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f5f5f3"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>{c.name}</div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={addTask} disabled={!taskDraft.title.trim()} style={{fontSize:12,padding:"5px 14px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:8,cursor:"pointer"}}>Add task</button>
                      <button onClick={()=>{setShowAddTask(false);setTaskDraft({title:"",projectId:"",contactId:"",dueDate:"",priority:"",notes:""});setContactSearch("");}} style={{fontSize:12}}>Cancel</button>
                    </div>
                  </div>
                )}

                {/* Task list */}
                {Object.entries(tasksBySubProject).map(([pid,group])=>(
                  <React.Fragment key={pid}>
                    {selProject==="all"&&(
                      <div style={{fontSize:11,fontWeight:600,color:"#999",padding:"10px 20px 4px",background:"#fafaf8",borderBottom:"0.5px solid #eee",display:"flex",alignItems:"center",gap:6}}>
                        <div style={{width:7,height:7,borderRadius:2,background:projectColor(pid)}}/>
                        {group.project.name}
                      </div>
                    )}
                    {group.directTasks.map(t=>(
                      <TaskRow key={t.id} t={t} contacts={contacts} projectPath={projectPath} projectColor={projectColor} priStyle={priStyle} priLabel={priLabel} toggleTask={toggleTask} deleteTask={deleteTask} startTimer={startTimer} timer={timer} editingTask={editingTask} setEditingTask={setEditingTask} saveTask={saveTask} projects={projects} selProject={selProject}/>
                    ))}
                    {group.subGroups&&group.subGroups.map(sg=>(
                      <React.Fragment key={sg.sub.id}>
                        {sg.tasks.length>0&&<div style={{fontSize:10,fontWeight:600,color:"#bbb",padding:"8px 20px 3px",textTransform:"uppercase",letterSpacing:"0.3px",background:"#fafaf8",borderBottom:"0.5px solid #eee"}}>{sg.sub.name}</div>}
                        {sg.tasks.map(t=>(
                          <TaskRow key={t.id} t={t} contacts={contacts} projectPath={projectPath} projectColor={projectColor} priStyle={priStyle} priLabel={priLabel} toggleTask={toggleTask} deleteTask={deleteTask} startTimer={startTimer} timer={timer} editingTask={editingTask} setEditingTask={setEditingTask} saveTask={saveTask} projects={projects} selProject={selProject}/>
                        ))}
                      </React.Fragment>
                    ))}
                  </React.Fragment>
                ))}
                {filteredTasks.length===0&&<div style={{padding:"40px 20px",textAlign:"center",color:"#ccc",fontSize:13}}>{subTab==="completed"?"No completed tasks yet.":"No tasks yet. Create one above."}</div>}
              </div>
            )}

            {/* Time log sub-tab */}
            {subTab==="timelog"&&(
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 20px",borderBottom:"0.5px solid #eee"}}>
                  <div style={{display:"flex",gap:4}}>
                    {[["today","Today"],["week","This week"],["month","This month"]].map(([k,l])=>(
                      <button key={k} onClick={()=>setTimePeriod(k)} style={{fontSize:12,padding:"4px 10px",borderRadius:6,border:"none",background:timePeriod===k?"#f0f0ee":"transparent",color:timePeriod===k?"#1a1a1a":"#999",fontWeight:timePeriod===k?500:400,cursor:"pointer"}}>{l}</button>
                    ))}
                  </div>
                  <span style={{fontSize:14,fontWeight:500}}>{fmtDurShort(totalTime)}</span>
                </div>
                {filteredTimeEntries.map(e=>(
                  <div key={e.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 20px",borderBottom:"0.5px solid #eee"}}>
                    <div style={{width:8,height:8,borderRadius:2,background:projectColor(e.projectId),flexShrink:0}}/>
                    <span style={{fontSize:13,flex:1}}>{e.description}</span>
                    <span style={{fontSize:12,color:"#999"}}>{projectPath(e.projectId)}</span>
                    <span style={{fontSize:13,fontWeight:500,minWidth:56,textAlign:"right"}}>{fmtDurShort(e.duration)}</span>
                  </div>
                ))}
                {filteredTimeEntries.length===0&&<div style={{padding:"40px 20px",textAlign:"center",color:"#ccc",fontSize:13}}>No time entries for this period.</div>}
                {timeByProject.length>0&&(
                  <div style={{padding:"14px 20px",background:"#fafaf8",borderTop:"0.5px solid #eee"}}>
                    <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",gap:2,marginBottom:8}}>
                      {timeByProject.map((p,i)=><div key={i} style={{flex:p.dur,background:p.color,borderRadius:i===0?"4px 0 0 4px":i===timeByProject.length-1?"0 4px 4px 0":"0"}}/>)}
                    </div>
                    <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                      {timeByProject.map((p,i)=>(
                        <span key={i} style={{fontSize:11,display:"flex",alignItems:"center",gap:4,color:"#666"}}>
                          <span style={{width:7,height:7,borderRadius:2,background:p.color,display:"inline-block"}}/>
                          {p.name} {fmtDurShort(p.dur)}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function TaskRow({t,contacts,projectPath,projectColor,priStyle,priLabel,toggleTask,deleteTask,startTimer,timer,editingTask,setEditingTask,saveTask,projects,selProject}){
  const [showDel,setShowDel]=useState(false);
  const contact=contacts.find(c=>c.id===t.contactId);
  const isDone=t.status==="done";
  const isTimerOn=timer.running&&timer.taskId===t.id;

  if(editingTask===t.id){
    return(
      <div style={{padding:"10px 20px",borderBottom:"0.5px solid #eee",background:"#fafaf8"}}>
        <input value={t.title} onChange={e=>saveTask({...t,title:e.target.value})} style={{fontSize:13,marginBottom:6}}/>
        <div style={{display:"flex",gap:6,marginBottom:6}}>
          <select value={t.priority||""} onChange={e=>saveTask({...t,priority:e.target.value})} style={{fontSize:12,flex:1}}><option value="">Priority</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
          <select value={t.projectId||""} onChange={e=>saveTask({...t,projectId:e.target.value})} style={{fontSize:12,flex:1}}><option value="">No project</option>{projects.map(p=><option key={p.id} value={p.id}>{p.parentId?"  ↳ ":""}{p.name}</option>)}</select>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setEditingTask(null)} style={{fontSize:12,padding:"4px 12px",background:"#4f6ef7",border:"none",color:"#fff",borderRadius:6}}>Done</button>
          <button onClick={()=>deleteTask(t.id)} style={{fontSize:12,padding:"4px 12px",color:"#c00",background:"none",border:"none"}}>Delete</button>
        </div>
      </div>
    );
  }

  return(
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 20px",borderBottom:"0.5px solid #eee"}} onMouseEnter={e=>e.currentTarget.style.background="#fafaf8"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
      <div onClick={()=>toggleTask(t.id)} style={{width:18,height:18,borderRadius:"50%",border:isDone?"none":"1.5px solid #ccc",background:isDone?"#1D9E75":"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {isDone&&<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4L3.5 6.5L9 1" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <span onClick={()=>setEditingTask(t.id)} style={{flex:1,fontSize:13,cursor:"pointer",textDecoration:isDone?"line-through":"none",color:isDone?"#bbb":"#1a1a1a"}}>{t.title}</span>
      <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
        {contact&&<span style={{fontSize:11,color:"#4f6ef7",background:"#eef0ff",padding:"2px 8px",borderRadius:12,whiteSpace:"nowrap"}}>{contact.name}</span>}
        {t.priority&&priStyle[t.priority]&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:10,fontWeight:500,...priStyle[t.priority]}}>{priLabel[t.priority]}</span>}
        {t.dueDate&&<span style={{fontSize:12,color:"#999",whiteSpace:"nowrap"}}>{fmtDate(t.dueDate)}</span>}
        {!isDone&&(
          <div onClick={()=>{if(isTimerOn)return;startTimer(t.id);}} style={{width:24,height:24,borderRadius:"50%",background:isTimerOn?"rgba(220,60,60,0.1)":"#f0f0ee",display:"flex",alignItems:"center",justifyContent:"center",cursor:isTimerOn?"default":"pointer",flexShrink:0}} title={isTimerOn?"Timer running":"Start timer"}>
            {isTimerOn?<div style={{width:6,height:6,borderRadius:1,background:"#b91c1c"}}/>:<svg width="8" height="10" viewBox="0 0 8 10"><polygon points="0,0 8,5 0,10" fill="#999"/></svg>}
          </div>
        )}
      </div>
    </div>
  );
}


function App(){

  const [imported,setImported]=useState(false);
  const [tab,setTab]=useState("dashboard");

  const [dashCalDate,setDashCalDate]=useState(new Date());
  const [dashPopup,setDashPopup]=useState(null);
  const [showAddContact,setShowAddContact]=useState(false);
  const [showAddInteraction,setShowAddInteraction]=useState(false);
  const [showAddGroup,setShowAddGroup]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [showEditGroups,setShowEditGroups]=useState(false);
  const [showWhatsApp,setShowWhatsApp]=useState(false);
  const [newGroup,setNewGroup]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiSummary,setAiSummary]=useState("");
  const [summaryLoading,setSummaryLoading]=useState(false);
  const [recording,setRecording]=useState(false);
  const [mediaRec,setMediaRec]=useState(null);
  const [detailNote,setDetailNote]=useState("");
  const [syncStatus,setSyncStatus]=useState("");
  const [syncing,setSyncing]=useState(false);
  const [sbUrl,setSbUrl]=useState(()=>localStorage.getItem("sb_url")||"");
  const [sbKey,setSbKey]=useState(()=>localStorage.getItem("sb_key")||"");
  const [sbUrlInput,setSbUrlInput]=useState("");
  const [sbKeyInput,setSbKeyInput]=useState("");
  const [contactSearch,setContactSearch]=useState("");
  const [loadingDB,setLoadingDB]=useState(false);
  const [waText,setWaText]=useState("");
  const [waContact,setWaContact]=useState("");
  const [waLoading,setWaLoading]=useState(false);
  const [showTimerStart,setShowTimerStart]=useState(false);
  const [freeTimerDesc,setFreeTimerDesc]=useState("");
  const [freeTimerProject,setFreeTimerProject]=useState("");
  const [anthropicKey,setAnthropicKey]=useState(()=>localStorage.getItem("anthropic_key")||"");
  const [anthropicKeyInput,setAnthropicKeyInput]=useState("");
  const fileRef=useRef();
  const cardRef=useRef();
  const [cf,setCf]=useState({name:"",company:"",role:"",location:"",email:"",phone:"",groups:[],notes:""});
  const [inf,setInf]=useState({contactIds:[],date:"",note:"",type:""});

  // Persist projects/tasks/time to localStorage
  useEffect(()=>{localStorage.setItem("collective_projects",JSON.stringify(projects));},[projects]);
  useEffect(()=>{localStorage.setItem("collective_tasks",JSON.stringify(tasks));},[tasks]);
  useEffect(()=>{localStorage.setItem("collective_time_entries",JSON.stringify(timeEntries));},[timeEntries]);

  // Timer tick
  useEffect(()=>{
    if(!timer.running)return;
    const iv=setInterval(()=>{setTimerDisplay(Math.floor((Date.now()-timer.startTime)/1000));},1000);
    return()=>clearInterval(iv);
  },[timer.running,timer.startTime]);

  useEffect(()=>{if(sbUrl&&sbKey)loadFromSupabase(sbUrl,sbKey);},[]);
  useEffect(()=>{localStorage.setItem("reminders",JSON.stringify(reminders));},[reminders]);

  const goTab=t=>{setPrevTab(tab);setTab(t);setSelected(null);setShowEditGroups(false);setAiSummary("");};
  const goBack=()=>{if(selected){setSelected(null);setDetailNote("");setShowEditGroups(false);setAiSummary("");}else if(prevTab){setTab(prevTab);setPrevTab(null);}else setTab("dashboard");};

  const sbFetch=useCallback(async(url,key,path,method="GET",body=null)=>{
    const h={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"};
    if(method==="POST")h["Prefer"]="resolution=merge-duplicates";
    const opts={method,headers:h};if(body)opts.body=JSON.stringify(body);
    const r=await fetch(url+"/rest/v1/"+path,opts);
    if(!r.ok){const e=await r.text();throw new Error(e);}
    return method==="GET"?r.json():null;
  },[]);

  const callClaude=async(prompt)=>{
    const key=localStorage.getItem("anthropic_key")||anthropicKey||sbKey;
    if(!key)throw new Error("No API key");
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    return(data.content||[]).map(b=>b.text||"").join("");
  };

  const loadFromSupabase=async(url,key)=>{
    setLoadingDB(true);setSyncStatus("Loading…");
    try{
      const [c,i,g]=await Promise.all([
        sbFetch(url,key,"contacts?select=*&order=name&limit=2000"),
        sbFetch(url,key,"interactions?select=*&order=date.desc&limit=9999"),
        sbFetch(url,key,"groups?select=*&order=name&limit=200")
      ]);
      setContacts(c.map(r=>({...r,groupIds:(r.group_ids||"").split(",").filter(Boolean)})));
      setInteractions(i.map(r=>({...r,personId:r.person_id,note:r.note||r.notes||""})));
      setGroups(g);setImported(true);
      setSyncStatus("Loaded "+c.length+" contacts · "+i.length+" interactions · "+g.length+" groups ✓");
    }catch(e){setSyncStatus("Load failed: "+e.message);}
    setLoadingDB(false);
  };

  const connectSupabase=async()=>{
    if(!sbUrlInput.trim()||!sbKeyInput.trim())return;
    const url=sbUrlInput.trim().replace(/\/$/,"");const key=sbKeyInput.trim();
    localStorage.setItem("sb_url",url);localStorage.setItem("sb_key",key);
    if(anthropicKeyInput.trim())localStorage.setItem("anthropic_key",anthropicKeyInput.trim());
    setSbUrl(url);setSbKey(key);setAnthropicKey(anthropicKeyInput.trim()||anthropicKey);setShowSettings(false);
    await loadFromSupabase(url,key);
  };

  const syncToSupabase=async()=>{
    if(!sbUrl||!sbKey){setSyncStatus("Connect Supabase first.");return;}
    setSyncing(true);setSyncStatus("Syncing…");
    try{
      const BATCH=50;
      const dedupe=rows=>{const seen=new Set();return rows.filter(r=>{if(!r.id||seen.has(r.id))return false;seen.add(r.id);return true;});};
      const upsert=async(table,rows)=>{const u=dedupe(rows);for(let i=0;i<u.length;i+=BATCH)await sbFetch(sbUrl,sbKey,table,"POST",u.slice(i,i+BATCH));};
      await upsert("groups",groups.map(g=>({id:g.id,name:g.name,description:g.description||"",icon:g.icon||"",people_ids:(g.peopleIds||[]).join(",")})));
      await upsert("contacts",contacts.map(c=>({id:c.id,name:c.name,email:c.email||"",phone:c.phone||"",notes:c.notes||"",date_met:c.dateMet||"",company:c.company||"",role:c.role||"",location:c.location||"",group_ids:(c.groupIds||c.groups||[]).join(",")})));
      await upsert("interactions",interactions.map(i=>({id:i.id,person_id:i.personId||i.person_id||"",type:i.type||"",date:i.date||"",note:i.note||""})));
      setSyncStatus("Synced "+contacts.length+" contacts · "+interactions.length+" interactions ✓");
    }catch(e){setSyncStatus("Sync failed: "+e.message);}
    setSyncing(false);
  };

  const handleImportFiles=async e=>{
    const files=Array.from(e.target.files);
    try{
      const read=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);});
      let pf=null,intf=null,gf=null;
      files.forEach(f=>{const n=f.name.toLowerCase();if(n.includes("people"))pf=f;else if(n.includes("interaction"))intf=f;else if(n.includes("group"))gf=f;});
      if(gf){const rows=parseCSV(await read(gf));const gl=rows.map(r=>({id:r.Id||r.id,name:r.Name||r.name,description:r.Description||"",icon:r.Icon||"",peopleIds:(r.People||"").split(",").map(s=>s.trim()).filter(Boolean)})).filter(g=>g.name);setGroups(gl);}
      if(pf){const rows=parseCSV(await read(pf));setContacts(rows.map(r=>({id:r.Id||r.id,name:r.Name||r.name||"",email:r.Email||r.email||"",phone:r.Phone||r.phone||"",notes:r.Notes||r.notes||"",dateMet:toIso(r["Date Met"]||""),groupIds:(r.Groups||r.groups||"").split(",").map(s=>s.trim()).filter(Boolean),company:"",role:"",location:""})).filter(c=>c.name));}
      if(intf){const rows=parseCSV(await read(intf));setInteractions(rows.map(r=>({id:r["Id"]||r["id"],personId:r["Person Id"]||r["person_id"]||"",type:r["Type"]||r["type"]||"",date:toIso(r["Date"]||r["date"]||""),note:r["Notes"]||r["notes"]||""})).filter(i=>i.personId&&i.id));}
      setImported(true);setSyncStatus("CSVs imported ✓ — hit Sync to save");
    }catch(e){alert("Import failed: "+e.message);}
    e.target.value="";
  };

  const handleCardScan=async e=>{
    const file=e.target.files[0];if(!file)return;
    setAiLoading(true);
    const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
    try{
      const b64=await toB64(file);
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":sbKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},{type:"text",text:"This is a business card. Extract: name, email, phone, company, role. Respond ONLY as JSON: {\"name\":\"\",\"email\":\"\",\"phone\":\"\",\"company\":\"\",\"role\":\"\"}"}]}]})});
      const data=await resp.json();
      const text=(data.content||[]).map(b=>b.text||"").join("");
      const clean=text.replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(clean);
      setCf({name:parsed.name||"",email:parsed.email||"",phone:parsed.phone||"",company:parsed.company||"",role:parsed.role||"",location:"",groups:[],notes:""});
      setShowAddContact(true);
    }catch(err){alert("Could not read card. Please fill in manually.");}
    setAiLoading(false);e.target.value="";
  };

  const handleWhatsAppImport=async()=>{
    if(!waText.trim()||!waContact)return;
    setWaLoading(true);
    try{
      const result=await callClaude(`This is a WhatsApp chat export. The contact is: ${contacts.find(c=>c.id===waContact)?.name||"Unknown"}. Extract the key points from this conversation as a concise interaction note (2-4 sentences). Also identify the most recent date mentioned or use today. Respond as JSON: {"note":"","date":"YYYY-MM-DD"}\n\nChat:\n${waText.slice(0,3000)}`);
      const clean=result.replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(clean);
      const ni={id:"i_"+Date.now(),personId:waContact,person_id:waContact,type:"Note",date:parsed.date||today(),note:parsed.note||waText.slice(0,500)};
      setInteractions(is=>[ni,...is]);
      if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions","POST",[{id:ni.id,person_id:waContact,type:"Note",date:ni.date,note:ni.note}]).catch(()=>{});
      setShowWhatsApp(false);setWaText("");setWaContact("");
      setSyncStatus("WhatsApp conversation imported as interaction ✓");
    }catch(err){alert("Could not parse conversation.");}
    setWaLoading(false);
  };

  const generateSummary=async()=>{
    if(!selected||!sbKey)return;
    setSummaryLoading(true);setAiSummary("");
    try{
      const ints=interactions.filter(i=>(i.personId||i.person_id)===selected.id).slice(0,20);
      const intText=ints.map(i=>`${i.date} (${i.type||"interaction"}): ${i.note||"no notes"}`).join("\n");
      const prompt=`Write a concise relationship summary (3-4 sentences) for ${selected.name}. Include: who they are, how we know each other, key topics discussed, and what to remember for next interaction.\n\nContact notes: ${selected.notes||"none"}\n\nInteraction history:\n${intText||"No interactions recorded"}`;
      const result=await callClaude(prompt);
      setAiSummary(result);
    }catch(err){setAiSummary("Could not generate summary. Check your API key in settings.");}
    setSummaryLoading(false);
  };

  const contactGroups=useCallback(c=>{if(!c)return[];return(c.groupIds||c.groups||[]).map(gid=>{const g=groups.find(g=>g.id===gid||g.name===gid);return g?g.name:gid;}).filter(Boolean);},[groups]);
  const allGroupNames=useMemo(()=>[...new Set(groups.map(g=>g.name))],[groups]);
  const filteredContacts=useMemo(()=>contacts.filter(c=>{const q=search.toLowerCase();const cg=contactGroups(c);const mq=!q||c.name.toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q)||(c.company||"").toLowerCase().includes(q);return mq&&(filterGroup==="All"||cg.includes(filterGroup))&&(filterGroup2==="All"||cg.includes(filterGroup2));}),[contacts,search,filterGroup,filterGroup2,contactGroups]);
  const contactInts=useCallback(cId=>interactions.filter(i=>(i.personId||i.person_id)===cId).sort((a,b)=>b.date.localeCompare(a.date)),[interactions]);
  const lastInteraction=useCallback(cId=>{const hits=interactions.filter(i=>(i.personId||i.person_id)===cId).map(i=>i.date).filter(Boolean);return hits.length?hits.sort().reverse()[0]:null;},[interactions]);
  const contactName=useCallback(id=>contacts.find(c=>c.id===id)?.name||"Unknown",[contacts]);
  const intsOnDate=useCallback(d=>interactions.filter(i=>i.date===d),[interactions]);
  const groupMemberCount=useCallback(name=>contacts.filter(c=>contactGroups(c).includes(name)).length,[contacts,contactGroups]);
  const sortedGroups=useMemo(()=>[...groups].sort((a,b)=>groupMemberCount(b.name)-groupMemberCount(a.name)),[groups,groupMemberCount]);
  const recent3=useMemo(()=>[...interactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(i=>{const c=contacts.find(c=>c.id===(i.personId||i.person_id));return{...i,contactObj:c,cName:c?.name||"Unknown",cGroups:c?contactGroups(c):[]};}),[interactions,contacts,contactGroups]);
  const upcomingReminders=useMemo(()=>reminders.filter(r=>r.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),[reminders]);
  const overdueReminders=useMemo(()=>reminders.filter(r=>r.date<today()).sort((a,b)=>b.date.localeCompare(a.date)),[reminders]);

  // Tasks linked to a contact
  const contactTasks=useCallback(cId=>tasks.filter(t=>t.contactId===cId&&t.status!=="done"),[tasks]);

  const deleteContact=c=>{if(!window.confirm("Delete "+c.name+"?"))return;setContacts(cs=>cs.filter(x=>x.id!==c.id));setSelected(null);if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts?id=eq."+c.id,"DELETE").catch(()=>{});};
  const deleteInteraction=i=>{setInteractions(is=>is.filter(x=>x.id!==i.id));if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions?id=eq."+i.id,"DELETE").catch(()=>{});};
  const saveEditInt=draft=>{setInteractions(is=>is.map(i=>i.id===draft.id?{...draft}:i));if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions?id=eq."+draft.id,"PATCH",{person_id:draft.personId||draft.person_id,type:draft.type||"",date:draft.date||"",note:draft.note||""}).catch(()=>{});};
  const addReminderToInt=(i,date,note)=>{const r={id:"r_"+Date.now(),intId:i.id,contactId:i.personId||i.person_id,contactName:contactName(i.personId||i.person_id),date,note,intNote:i.note||""};setReminders(rs=>[...rs,r]);setInteractions(is=>is.map(x=>x.id===i.id?{...x,reminderDate:date}:x));};
  const dismissReminder=id=>setReminders(rs=>rs.filter(r=>r.id!==id));

  const handleQuickAdd=({contactId,type,date,note})=>{const ni={id:"i_"+Date.now(),personId:contactId,person_id:contactId,type:type||"Manual",date,note};setInteractions(is=>[ni,...is]);if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"interactions","POST",[{id:ni.id,person_id:contactId,type:ni.type,date,note}]).catch(()=>{});};

  const addContact=()=>{if(!cf.name.trim())return;const nc={...cf,id:"c_"+Date.now(),groupIds:cf.groups,dateMet:"",company:cf.company||"",role:cf.role||"",location:cf.location||""};setContacts(cs=>[nc,...cs]);if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts","POST",[{id:nc.id,name:nc.name,email:nc.email||"",phone:nc.phone||"",notes:nc.notes||"",date_met:"",company:nc.company,role:nc.role,location:nc.location,group_ids:nc.groupIds.join(",")}]).catch(()=>{});setCf({name:"",company:"",role:"",location:"",email:"",phone:"",groups:[],notes:""});setShowAddContact(false);};

  const saveEditContact=()=>{if(!editingContact)return;setContacts(cs=>cs.map(c=>c.id===editingContact.id?{...editingContact}:c));setSelected({...editingContact});if(sbUrl&&sbKey)sbFetch(sbUrl,sbKey,"contacts?id=eq."+editingContact.id,"PATCH",{name:editingContact.name,email:editingContact.email||"",phone:editingContact.phone||"",company:editingContact.company||"",role:editingContact.role||"",location:editingContact.location||"",notes:editingContact.notes||""}).catch(()=>{});setEditingContact(null);};

      {/* WHATSAPP IMPORT MODAL */}
      {showWhatsApp&&(
        <div className="overlay">
          <div className="modal">
            <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>Import WhatsApp chat</div>
            <p style={{fontSize:12,color:"#666",marginBottom:14,lineHeight:1.6}}>In WhatsApp, open a chat → tap ··· → More → Export chat → Without media. Paste the text below.</p>
            <div style={{fontSize:12,color:"#666",marginBottom:4}}>Contact</div>
            <select value={waContact} onChange={e=>setWaContact(e.target.value)} style={{marginBottom:10}}>
              <option value="">Select contact…</option>
              {contacts.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <div style={{fontSize:12,color:"#666",marginBottom:4}}>Paste chat export</div>
            <textarea value={waText} onChange={e=>setWaText(e.target.value)} rows={8} placeholder="Paste WhatsApp chat text here…" style={{resize:"vertical",marginBottom:12}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={handleWhatsAppImport} disabled={!waContact||!waText.trim()||waLoading} style={{background:"#1D9E75",border:"none",color:"#fff",fontWeight:500,padding:"7px 18px",borderRadius:8,cursor:"pointer"}}>{waLoading?"Processing…":"Import"}</button>
              <button onClick={()=>{setShowWhatsApp(false);setWaText("");setWaContact("");}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
